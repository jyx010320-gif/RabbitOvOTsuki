<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的 API 站点</title>
<style>
  :root {
    --bg: #f4f6f7;
    --card: #ffffff;
    --text: #1f2d30;
    --text-sub: #5c7074;
    --line: #e3e9ea;
    --primary: #0e8a80;
    --primary-soft: #e6f4f2;
    --green: #1f9d6b;
    --yellow: #c98a12;
    --gray: #7a8a8d;
    --gray-soft: #eceff0;
    --shadow: 0 2px 10px rgba(31, 45, 48, 0.08);
    --radius: 14px;
  }

  /* 深色主题 */
  body.dark {
    --bg: #151a1b;
    --card: #22292b;
    --text: #e8eeee;
    --text-sub: #9db0b3;
    --line: #333c3e;
    --primary: #2bb8a9;
    --primary-soft: #1d3a37;
    --green: #3ecf96;
    --yellow: #e0a93f;
    --gray: #8a9a9d;
    --gray-soft: #2c3335;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  /* 动森主题：Nook Phone 奶油米白 + 海水蓝 + 棕榈绿 */
  body.acnh {
    --bg: #f3ecd7;
    --card: #fffaf0;
    --text: #5f5636;
    --text-sub: #978c68;
    --line: #e9dfc2;
    --primary: #57a53c;
    --primary-soft: #e5f0d5;
    --green: #4c9636;
    --yellow: #e9b95a;
    --gray: #9a9070;
    --gray-soft: #eee5cd;
    --sea: #8fc6c9;
    --shadow: 0 2px 10px rgba(150, 130, 80, 0.14);
  }

  /* 樱花粉 */
  body.sakura {
    --bg: #fdf3f5;
    --card: #ffffff;
    --text: #5a3a44;
    --text-sub: #9c7480;
    --line: #f3dbe1;
    --primary: #e07a96;
    --primary-soft: #fbe7ec;
    --green: #7fb56a;
    --yellow: #e8b04a;
    --gray: #9c8a90;
    --gray-soft: #f6e8ec;
    --shadow: 0 2px 10px rgba(180, 100, 120, 0.1);
  }

  /* 海盐蓝 */
  body.ocean {
    --bg: #eef5f8;
    --card: #ffffff;
    --text: #2f4650;
    --text-sub: #66828d;
    --line: #d8e7ec;
    --primary: #3d93b5;
    --primary-soft: #e2f1f6;
    --green: #5da37a;
    --yellow: #e0a93f;
    --gray: #7d959d;
    --gray-soft: #e7eff2;
    --shadow: 0 2px 10px rgba(60, 110, 130, 0.1);
  }

  /* 薄荷绿 */
  body.mint {
    --bg: #eef7f1;
    --card: #ffffff;
    --text: #2f4a3c;
    --text-sub: #6b8a78;
    --line: #d8ecdf;
    --primary: #4aa878;
    --primary-soft: #e2f3e9;
    --green: #3e9c66;
    --yellow: #e2b04a;
    --gray: #7d9588;
    --gray-soft: #e7f1ea;
    --shadow: 0 2px 10px rgba(60, 130, 90, 0.1);
  }

  /* 暗夜紫 */
  body.purple {
    --bg: #1e1a28;
    --card: #2a2438;
    --text: #ece6f5;
    --text-sub: #a496bd;
    --line: #3a3248;
    --primary: #a98bd8;
    --primary-soft: #3d3354;
    --green: #7ec98f;
    --yellow: #e0b35f;
    --gray: #9488a8;
    --gray-soft: #332c42;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  /* 暖阳橙 */
  body.orange {
    --bg: #fdf4ea;
    --card: #ffffff;
    --text: #5a4330;
    --text-sub: #9c8064;
    --line: #f3e2cf;
    --primary: #e08a3c;
    --primary-soft: #fbeedd;
    --green: #7fb05a;
    --yellow: #e8a02a;
    --gray: #9c8a78;
    --gray-soft: #f6eadd;
    --shadow: 0 2px 10px rgba(180, 120, 60, 0.1);
  }

  /* 原木棕 */
  body.wood {
    --bg: #f4ede2;
    --card: #fdf8f0;
    --text: #4e3f30;
    --text-sub: #8a7660;
    --line: #e6d8c4;
    --primary: #9c7446;
    --primary-soft: #f0e4d2;
    --green: #7f9a5a;
    --yellow: #c99a3c;
    --gray: #8a7a68;
    --gray-soft: #ece1cf;
    --shadow: 0 2px 10px rgba(120, 90, 50, 0.12);
  }

  /* 暗夜金 */
  body.gold {
    --bg: #171512;
    --card: #242019;
    --text: #f0e7d6;
    --text-sub: #b3a684;
    --line: #3a3327;
    --primary: #d9a94e;
    --primary-soft: #3a3120;
    --green: #8fbf6a;
    --yellow: #e8b95a;
    --gray: #9c8f72;
    --gray-soft: #2e281e;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }

  /* 芋泥浅紫 */
  body.lavender {
    --bg: #f3f0fa;
    --card: #ffffff;
    --text: #463a5c;
    --text-sub: #8678a0;
    --line: #e3dbf0;
    --primary: #8e74c9;
    --primary-soft: #ece4f7;
    --green: #7fb58a;
    --yellow: #d9a95f;
    --gray: #8a7d9e;
    --gray-soft: #ece6f2;
    --shadow: 0 2px 10px rgba(120, 100, 160, 0.1);
  }

  /* 樱桃红 */
  body.cherry {
    --bg: #fdf1f0;
    --card: #ffffff;
    --text: #5c3232;
    --text-sub: #9c6b6b;
    --line: #f3d9d7;
    --primary: #d9534f;
    --primary-soft: #fbe7e6;
    --green: #7fb56a;
    --yellow: #e8a03c;
    --gray: #9c7878;
    --gray-soft: #f6e8e7;
    --shadow: 0 2px 10px rgba(180, 90, 90, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 90px;
    /* 禁止双击缩放、长按缩放手势 */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    /* 禁止长按选中文字与系统识别菜单 */
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* 输入框内允许选择文字，方便填写和修改 */
  input, select, textarea {
    -webkit-user-select: text;
    -moz-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ===== 头部 ===== */
  header.page-header { margin-bottom: 28px; }

  header.page-header h1 {
    font-size: 28px;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  header.page-header p {
    color: var(--text-sub);
    font-size: 15px;
  }

  /* ===== 统计概览 ===== */
  .stats {
    display: flex;
    gap: 14px;
    margin: 24px 0 30px;
  }

  .stat-box {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .stat-box .num { font-size: 26px; font-weight: 700; }

  .stat-box .label {
    font-size: 13px;
    color: var(--text-sub);
  }

  .stat-box.total .num { color: var(--primary); }
  .stat-box.cat .num   { color: var(--green); }

  /* ===== 搜索框 ===== */
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .search-wrap input {
    width: 100%;
    padding: 11px 14px 11px 40px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
  }

  .search-wrap input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  .search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    pointer-events: none;
  }

  /* ===== 分类标签栏：横向平行滑动 ===== */
  .tags-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    position: relative;
  }

  /* 滑动区域：只放分类标签，独立横向滚动 */
  .tags-scroll {
    flex: 1;
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .tags-scroll::-webkit-scrollbar { display: none; }

  .tags-bar span {
    flex-shrink: 0;
    white-space: nowrap;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text-sub);
    cursor: pointer;
  }

  /* “全部”固定在栏位最左侧，不在滑动区域内，不可拖动 */
  .tags-bar span.fixed {
    position: relative;
    z-index: 2;
    box-shadow: 10px 0 12px -10px rgba(31, 45, 48, 0.3);
  }

  .tags-bar span.active {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }

  /* 卡片允许上下翻页，标签允许左右滑动；长按激活拖拽后由脚本接管 */
  .site-card { touch-action: pan-y; }
  .tags-bar span { touch-action: pan-x; }

  /* ===== 站点卡片网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    align-items: start;
  }

  .site-card {
    width: 100%;
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .site-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(31, 45, 48, 0.12);
  }

  /* 拖拽进行中：关闭其它卡片/标签的悬停反应，避免经过时跳动 */
  body.dragging .site-card:hover,
  body.dragging .tags-bar span:hover {
    transform: none;
    box-shadow: var(--shadow);
  }

  /* 长按拖拽排序 */
  .drag-src {
    opacity: 0.35;
    -webkit-user-select: none;
    user-select: none;
  }

  .drag-ghost {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    opacity: 0.96;
    margin: 0;
    box-shadow: 0 10px 24px rgba(31, 45, 48, 0.25);
    border-radius: var(--radius);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    min-width: 0;
  }

  .site-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 700;
    min-width: 0;
  }

  .btn-model-card {
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--primary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    padding: 2px 4px;
  }

  .site-name-btn {
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .site-name a {
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .site-name a:hover { color: var(--primary); }

  /* 分类徽章 */
  .cat-badge {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--primary);
    background: var(--primary-soft);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
  }

  /* 卡片内标签 */
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag-list .tag {
    font-size: 12px;
    color: var(--text-sub);
    background: var(--gray-soft);
    padding: 2px 10px;
    border-radius: 6px;
  }

  .site-desc {
    font-size: 14px;
    color: var(--text-sub);
    flex-grow: 1;
  }

  /* ===== 折叠卡片 ===== */
  .card-head {
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-note {
    font-size: 13px;
    color: var(--text-sub);
    white-space: normal;
    overflow-wrap: break-word;
    word-break: break-word;
    min-width: 0;
  }

  .fold-arrow {
    align-self: flex-end;
    font-size: 14px;
    color: var(--text-sub);
    transition: transform 0.2s ease;
    line-height: 1;
  }

  .site-card:not(.collapsed) .fold-arrow { transform: rotate(180deg); }

  /* 展开后才显示的详细信息 */
  .card-detail {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
    font-size: 13px;
    color: var(--text-sub);
  }

  .site-card.collapsed .card-detail { display: none; }

  /* 卡片底部信息 */
  .card-meta {
    border-top: 1px dashed var(--line);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--text-sub);
  }

  .card-meta .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .card-meta a {
    color: var(--primary);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .card-meta a:hover { text-decoration: underline; }

  .meta-key { flex-shrink: 0; }

  .meta-val {
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .meta-val.key {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }

  .key-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .copy-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .copy-btn {
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--primary);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    padding: 0 2px;
  }
  .key-eye {
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--primary);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    padding: 0 2px;
  }

  /* 链接小按钮 */
  .link-btn {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 8px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    word-break: keep-all;
  }

  .link-btn:hover { background: var(--primary); color: #fff; }
  .link-btn:active { background: var(--primary); filter: brightness(0.92); color: #fff; }

  .btn-group {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }

  .btn-group .link-btn {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 6px;
  }

  button.link-btn {
    border: none;
    font-family: inherit;
    cursor: pointer;
  }

  /* ===== 详情弹窗 ===== */
  .detail-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 110;
    padding: 20px;
  }

  .detail-modal.open { display: flex; }

  .detail-box {
    background: var(--card);
    border-radius: var(--radius);
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .detail-header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }

  .detail-header h3 { font-size: 16px; }

  .detail-close {
    border: none;
    background: var(--gray-soft);
    color: var(--text-sub);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }

  .detail-body {
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .detail-footer {
    flex-shrink: 0;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
  }

  .btn-edit { border: none; font-family: inherit; cursor: pointer; }

  .detail-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
  }

  .detail-row .meta-key { color: var(--text-sub); flex-shrink: 0; }

  .detail-row .meta-val {
    text-align: right;
    word-break: break-all;
  }

  .detail-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: flex-end;
  }

  /* 模型价格列表 */
  .model-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 180px;
  }

  .model-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .model-name { flex: 0 0 auto; }

  .model-chip {
    flex: 0 0 auto;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary);
  }

  .model-mode {
    flex: 0 0 auto;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--gray-soft);
    color: var(--text-sub);
  }

  .model-cat-picks {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .model-cat-scroll {
    flex: 1;
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .model-cat-scroll::-webkit-scrollbar { display: none; }

  .model-cat-item {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .model-cat-pick {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--line);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }

  .model-cat-pick.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .model-cat-del {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border: none;
    border-radius: 50%;
    background: var(--gray-soft);
    color: var(--text-sub);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }

  .model-cat-add {
    flex-shrink: 0;
    border-radius: 0;
  }

  .model-price {
    margin-left: auto;
    color: var(--green);
    font-weight: 600;
  }

  /* 充值档位卡片 */
  .plan-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    min-width: 200px;
  }

  .plan-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
  }

  .plan-name {
    font-size: 14px;
    margin-bottom: 8px;
  }

  .plan-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .plan-price {
    color: #e05252;
    font-weight: 700;
  }

  /* ===== 页脚 ===== */
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;

  /* ===== 全屏新建表单页面 ===== */

  .btn-save   { background: var(--primary); color: #fff; }

  /* ===== 设置页 ===== */
  .setting-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .setting-row {
    display: flex;
    align-items: center;

  .theme-opt {

    min-width: 80px;
    padding: 11px 12px;
    border: 1px solid var(--line);

  .manage-row {

    align-items: center;

    cursor: pointer;

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 600px) {
    .grid  { grid-template-columns: 1fr; }

  /* ===== 点击飘心特效 ===== */
  .heart-fly {

    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 9999;
    color: var(--primary);
    line-height: 1;
    will-change: transform, opacity;
    animation: heartFly ease-out forwards;
  }
  @keyframes heartFly {
    0% {
      transform: translate(-50%, -50%) scale(var(--s, 1));
      opacity: var(--o, 0.8);
    }
    100% {
      transform: translate(calc(-50% + var(--ex, 0px)), calc(-50% + var(--ey, 0px))) scale(calc(var(--s, 1) * 0.6));
      opacity: 0;
    }
  }
</style>

<body>
<div class="container">

  <header class="page-header">
    <h1>我的 API 站点</h1>

  <!-- 站点卡片列表 -->
  <section class="grid" id="cardList">


  </section>

</div>

<!-- 底部固定 Tab 栏：首页 | 新建 | 设置 -->

</nav>

<!-- 全屏新建表单页面 -->
<div class="panel" id="panel">
  <div class="panel-header">
    <h2 id="panelTitle">新增 API 站点</h2>
  </div>

  <div class="panel-body">
    <div class="form-inner">
      <!-- 基础信息：新建时填写 -->
      <div class="field-group base-fields" id="baseFields">
        <div class="form-item">
          <label>名称 <span class="req">*</span></label>
          <input type="text" id="fName" placeholder="例如：示例天气 API">
        </div>

        <div class="form-item">
          <label>密钥</label>
          <input type="text" id="fKey" placeholder="例如 sk-xxxxxxxx，没有可留空">
        </div>

        <div class="form-item">
          <label>API 主机</label>
          <input type="text" id="fHost" placeholder="例如 api.example.com">
        </div>

        <div class="form-item">
          <label>分类</label>
          <select id="fCat"></select>
          <div class="cat-edit-row">
            <input type="text" id="fNewCat" placeholder="输入新分类名，快速新建分类">

        </div>

        <div class="form-item">

        </div>

        <div class="form-item">
          <label>备注</label>
          <textarea id="fNote" placeholder="注册要求、额度限制、使用注意事项等"></textarea>
        </div>

        <div class="form-item">
          <label>网页链接</label>
          <input type="text" id="fWeb" placeholder="https://example.com">
        </div>

        <div class="form-item">
          <label>群聊 / QQ 群号</label>
          <input type="text" id="fGroup" placeholder="群聊链接或 QQ 群号，没有可留空">
        </div>

        <div class="form-item">
          <label>签到链接</label>
          <input type="text" id="fCheckin" placeholder="签到 / 每日领取链接，没有可填无">
        </div>

        <div class="form-item">
          <label>邀请链接</label>
          <input type="text" id="fInvite" placeholder="邀请 / 推广注册链接，没有可填无">
        </div>
      </div>

      <!-- 充值信息：编辑时填写 -->
      <div class="field-group recharge-fields hidden" id="rechargeFields">
        <div class="form-item">
          <label>充值链接</label>
          <input type="text" id="fRecharge" placeholder="余额充值 / 套餐购买页面链接，没有可留空">
        </div>

        <div class="form-item">
          <label>充值档位（额度 | 价格）</label>
          <textarea id="fPlans" rows="3" placeholder="一行一个，格式：额度 | 价格&#10;例如：100 额度 | ¥100&#10;50 额度 | ¥50"></textarea>
        </div>

        <div class="form-item">
          <label>折扣说明</label>
          <textarea id="fDiscount" placeholder="例如：新用户首充 8 折、包月套餐立减 5 元等，没有可留空"></textarea>
        </div>

        <div class="form-item">
          <label>模型价格列表（分类 | 模型名 | 价格 | 计费方式）</label>
          <textarea id="fModels" rows="3" placeholder="一行一个，分类可自定义填写；计费方式填按次或按量&#10;例如：通用 | gpt-3.5 | 0.0005 元/千token | 按次&#10;识图 | gpt-4o | 0.002 元/千token | 按次"></textarea>
          <div class="model-cat-picks">
            <button type="button" class="model-cat-pick model-cat-add" id="btnAddModelCatPick">设置</button>
            <div class="model-cat-scroll" id="modelCatScroll"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-footer">
    <button class="btn-cancel" id="btnCancel">取消</button>
    <button class="btn-save" id="btnSave">保存</button>
  </div>
</div>

<!-- 站点详情弹窗 -->
<div class="detail-modal" id="detailModal">

<script>
  const panel     = document.getElementById('panel');

  // 禁止双击触发默认放大行为
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => {
    const t = e.target;
    if (t.closest('input, textarea, select')) return;
    e.preventDefault();
  });
  const openBtn   = document.getElementById('openPanel');
  const btnCancel = document.getElementById('btnCancel');
  const btnSave   = document.getElementById('btnSave');
  const cardList  = document.getElementById('cardList');
  const baseFields     = document.getElementById('baseFields');

    d = d || {};
    return {
      id:       d.id || uid(),
      name:     d.name || '',
      key:      d.key || '',
      host:     d.host || '',
      cat:      d.cat || '其他',

  // 拆分标签，兼容中英文逗号
  function splitTags(str) {
    return str.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
  }

  // 解析模型列表：支持数组 {name,tag,price} 或文本“模型名 | 标签 | 价格”每行一个
  function parseModels(input) {
    if (Array.isArray(input)) {
      return input.map(m => ({
        name:  (m && m.name)  || '',
        tag:   (m && m.tag)   || '',
        price: (m && m.price) || '',
        mode:  (m && m.mode)  || ''
      })).filter(m => m.name);
    }
    // 文本格式：分类 | 模型名 | 价格 | 计费方式（按次/按量）
    return String(input || '').split(/\n/).map(line => {
      const p = line.split('|').map(x => x.trim());
      return { tag: p[0] || '', name: p[1] || '', price: p[2] || '', mode: p[3] || '' };
    }).filter(m => m.name);
  }

  function modelsToText(models) {
    return (models || []).map(m => [m.tag, m.name, m.price, m.mode].join(' | ')).join('\n');
  }

  // 解析充值档位：数组 {name,price,stock} 或文本“额度 | 价格 | 状态”每行一个
  function parsePlans(input) {
    if (Array.isArray(input)) {
      return input.map(p => ({
        name:  (p && p.name)  || '',
        price: (p && p.price) || '',
        stock: (p && p.stock) || ''
      })).filter(p => p.name);
    }
    return String(input || '').split(/\n/).map(line => {
      const p = line.split('|').map(x => x.trim());
      return { name: p[0] || '', price: p[1] || '', stock: p[2] || '' };
    }).filter(p => p.name);
  }

  function plansToText(plans) {
    return (plans || []).map(p => [p.name, p.price].join(' | ')).join('\n');

  function bindLongPressSort(container, axis, onEnd) {
    let timer = null, ghost = null, src = null;
    let startX = 0, startY = 0, dragging = false, suppress = false, gw = 0, gh = 0;
    let usingTouch = false;

    function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }

    function pt(e) {
      const t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
      return { x: t.clientX, y: t.clientY };
    }

    function onDown(e) {
      const isTouch = !!e.touches;
      if (isTouch) usingTouch = true;
      else if (usingTouch) return;
      const child = [...container.children].find(c => c.contains(e.target));
      if (!child) return;
      src = child;
      const p = pt(e);
      startX = p.x;
      startY = p.y;
      dragging = false;
      suppress = false;
      src.style.userSelect = 'none';
      clearTimer();
      timer = setTimeout(startDrag, 160);
    }

    function startDrag() {
      dragging = true;
      const r = src.getBoundingClientRect();
      gw = r.width;
      gh = r.height;
      ghost = src.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.width = gw + 'px';
      ghost.style.height = gh + 'px';
      ghost.style.left = r.left + 'px';
      ghost.style.top = r.top + 'px';
      document.body.appendChild(ghost);
      src.classList.add('drag-src');
      document.body.classList.add('dragging');
      document.body.style.overflow = 'hidden';
    }

    function onMove(e) {
      if (!src) return;
      const p = pt(e);
      if (!dragging) {
        if (Math.abs(p.x - startX) > 14 || Math.abs(p.y - startY) > 14) clearTimer();
        return;
      }
      if (usingTouch) e.preventDefault();
      ghost.style.left = (p.x - gw / 2) + 'px';
      ghost.style.top = (p.y - gh / 2) + 'px';
      const others = [...container.children].filter(c => c !== src && c.offsetParent !== null);
      let anchor = null;
      for (const c of others) {
        const cr = c.getBoundingClientRect();
        const before = axis === 'x'
          ? p.x < cr.left + cr.width / 2
          : p.y < cr.top + cr.height / 2;
        if (before) { anchor = c; break; }
      }
      if (anchor) container.insertBefore(src, anchor);
      else container.appendChild(src);
    }

    function end() {
      if (dragging) {
        if (ghost) { ghost.remove(); ghost = null; }
        src && src.classList.remove('drag-src');
        document.body.classList.remove('dragging');
        document.body.style.overflow = '';
        suppress = true;
        onEnd && onEnd();
      }
      clearTimer();
      if (src) src.style.userSelect = '';
      src = null;
      ghost = null;
      dragging = false;
      usingTouch = false;
    }

    container.addEventListener('touchstart', onDown, { passive: true });
    container.addEventListener('touchmove', onMove, { passive: false });
    container.addEventListener('touchend', end);
    container.addEventListener('touchcancel', end);
    container.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);

    container.addEventListener('click', e => {
      if (suppress) { e.stopPropagation(); e.preventDefault(); suppress = false; }
    }, true);
  }

  bindLongPressSort(cardList, 'y', reorderSites);
  bindLongPressSort(tagsScroll, 'x', reorderCats);
  bindLongPressSort(modelCatScroll, 'x', reorderModelCats);

  const dm       = document.getElementById('detailModal');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function copyText(text, btn) {
    if (!text) return;
    const flash = () => {
      const old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = old; }, 1200);
    };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); flash(); }
      catch (err) { alert('复制失败，请长按手动复制'); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash).catch(fallback);
    } else {
      fallback();
    }
  }

  function detailRow(key, valHtml) {
    return `<div class="detail-row"><span class="meta-key">${escapeHtml(key)}</span><span class="meta-val">${valHtml}</span></div>`;
  }

  function modelRowsHtml(d) {
    if (!d || !d.models || !d.models.length) return '<div class="meta-val">暂无模型价格</div>';
    const sorted = [...d.models].sort((a, b) => {
      const ta = a.tag || '', tb = b.tag || '';
      if (ta === tb) return 0;
      if (!ta) return 1;
      if (!tb) return -1;
      return ta.localeCompare(tb, 'zh');
    });
    const rows = sorted.map(m => {
      const chip = m.tag ? `<span class="model-chip">${escapeHtml(m.tag)}</span>` : '';
      const mode = m.mode ? `<span class="model-mode">${escapeHtml(m.mode)}</span>` : '';
      const price = m.price ? escapeHtml(m.price) : '—';
      return `<div class="model-item">${chip}<span class="model-name">${escapeHtml(m.name)}</span>${mode}<span class="model-price">${price}</span></div>`;
    }).join('');
    return `<div class="model-list">${rows}</div>`;
  }

    const name = card.querySelector('.site-name-btn')?.textContent.trim() || '未命名站点';

    card.querySelectorAll('.card-detail .row').forEach(r => {
      const key = r.querySelector('.meta-key')?.textContent.trim() || '';
      if (!allowed.includes(key)) return;
      const valEl = r.querySelector('.meta-val');
      let valHtml = '未填写';
      if (valEl) {
        const a = valEl.querySelector('a');
        const btn = valEl.querySelector('button');
        if (a) {
          valHtml = `<a class="meta-val" href="${a.href}" target="_blank" rel="noopener">${escapeHtml(a.textContent.trim())}</a>`;
        } else if (!btn) {
          valHtml = escapeHtml(valEl.textContent.trim());
        }
      }
      html += detailRow(key, valHtml);
    });

    // 充值档位：额度 + 价格，两列卡片
    if (d && d.plans && d.plans.length) {
      const cards = d.plans.map(p => {
        return `<div class="plan-card"><div class="plan-name">${escapeHtml(p.name)}</div><div class="plan-bottom"><span class="plan-price">${escapeHtml(p.price || '—')}</span></div></div>`;
      }).join('');
      html += detailRow('充值档位', `<div class="plan-grid">${cards}</div>`);
    }

    if (!html) html = '<div class="meta-val">暂无充值信息</div>';

    dmTitle.textContent = `${name} · 充值详情`;
    dmBody.innerHTML = html;
    dmEdit.style.display = '';
    dm.classList.add('open');
  }

  function openModels(card) {
    currentCard = card;
    const d = sites.find(s => s.id === card.dataset.id);
    const name = card.querySelector('.site-name-btn')?.textContent.trim() || '未命名站点';
    dmTitle.textContent = `${name} · 模型价格`;
    dmBody.innerHTML = detailRow('模型价格', modelRowsHtml(d));
    dmEdit.style.display = 'none';
    dm.classList.add('open');
  }

  dmClose.addEventListener('click', () => dm.classList.remove('open'));
  dm.addEventListener('click', e => { if (e.target === dm) dm.classList.remove('open'); });

  dmEdit.addEventListener('click', () => {
    if (!currentCard) return;
    dm.classList.remove('open');
    startEdit(currentCard);
  });

  // 卡片折叠 / 展开：点击头部切换；详情按钮打开弹窗；头部内链接点击不触发折叠
  cardList.addEventListener('click', e => {
    const copyBtn = e.target.closest('.copy-btn');
    if (copyBtn) {
      e.stopPropagation();
      copyText(copyBtn.dataset.copy, copyBtn);
      return;
    }
    const eye = e.target.closest('.key-eye');
    if (eye) {
      e.stopPropagation();
      const val = eye.closest('.row').querySelector('.meta-val.key');
      const show = eye.textContent === '显示';
      val.textContent = show ? val.dataset.key : '••••••••';
      eye.textContent = show ? '隐藏' : '显示';
      return;
    }
    const detailBtn = e.target.closest('.btn-detail');
    if (detailBtn) {
      e.stopPropagation();
      openDetail(detailBtn.closest('.site-card'));
      return;
    }
    const modelBtn = e.target.closest('.btn-model-card');
    if (modelBtn) {
      e.stopPropagation();
      openModels(modelBtn.closest('.site-card'));
      return;
    }
    const nameBtn = e.target.closest('.site-name-btn');
    if (nameBtn) {
      e.stopPropagation();
      startEdit(nameBtn.closest('.site-card'));
      return;
    }
    if (e.target.closest('a')) return;
    const head = e.target.closest('.card-head');
    if (head) head.closest('.site-card').classList.toggle('collapsed');
  });

  // 统计：站点数
  function updateStats() {
    const cards = document.querySelectorAll('.site-card');

    document.getElementById('footerText').innerText =
      `共收录 ${cards.length} 个 API 站点 · 页面可直接在浏览器打开使用`;
  }

  // ===== 主题切换 =====
  const THEME_LIST = ['light', 'dark', 'acnh', 'sakura', 'ocean', 'mint', 'purple', 'orange', 'wood', 'gold', 'lavender', 'cherry'];
  function applyTheme(theme) {
    THEME_LIST.forEach(t => {
      if (t !== 'light') document.body.classList.toggle(t, theme === t);
    });
    themeOptions.querySelectorAll('.theme-opt').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.theme === theme);
    });
  }

  let savedTheme = localStorage.getItem(THEME_KEY);
  let theme = THEME_LIST.includes(savedTheme) ? savedTheme : 'light';
  applyTheme(theme);

  themeOptions.addEventListener('click', e => {
    const btn = e.target.closest('.theme-opt');
    if (!btn) return;
    theme = btn.dataset.theme;
    localStorage.setItem(THEME_KEY, theme);
    applyTheme(theme);
  });

  themeHead.addEventListener('click', () => {
    const group = themeHead.closest('.theme-group');
    themeOptions.classList.toggle('hidden');
    group.classList.toggle('open');
  });

  // ===== 设置页：返回主页 / 导入 / 导出 =====
  function syncTab() {
    document.body.classList.toggle('tab-visible', settingPanel.classList.contains('open'));
  }
  tabSetting.addEventListener('click', () => { settingPanel.classList.add('open'); syncTab(); });
  tabHome.addEventListener('click', () => { settingPanel.classList.remove('open'); syncTab(); });
  document.getElementById('btnHome').addEventListener('click', () => {
    window.location.href = 'https://jyx010320-gif.github.io/RabbitOvOTsuki/';
  });

  // ===== 分类修改：分类重命名 =====
  function renameSiteCat(old, next) {
    if (!next) { alert('名称不能为空'); return false; }
    if (next === old) return false;
    sites.forEach(s => { if (s.cat === old) s.cat = next; });
    const order = loadCatOrder();
    const oi = order.indexOf(old);
    if (oi > -1) {
      if (!order.includes(next)) order[oi] = next;
      else order.splice(oi, 1);
      saveCatOrder(order);
    }
    saveStorage();
    renderAll();
    return true;
  }

  function removeSiteCat(cat) {
    if (!confirm(`确定删除分类「${cat}」吗？\n使用该分类的站点将归到「其他」。`)) return;
    saveCatOrder(loadCatOrder().filter(c => c !== cat));
    sites.forEach(s => { if (s.cat === cat) s.cat = '其他'; });
    saveStorage();
    renderAll();
    renderManage();
  }

  function fillManage(container, names) {
    container.innerHTML = '';
    if (!names.length) {
      const empty = document.createElement('div');
      empty.style.color = 'var(--text-sub)';
      empty.style.fontSize = '13px';
      empty.textContent = '暂无';
      container.appendChild(empty);
      return;
    }
    names.forEach(old => {
      const row = document.createElement('div');
      row.className = 'manage-row';
      row.dataset.cat = old;

      const input = document.createElement('input');
      input.className = 'manage-input';
      input.value = old;

      const save = document.createElement('button');
      save.type = 'button';
      save.className = 'link-btn manage-save';
      save.textContent = '保存';
      save.addEventListener('click', () => {
        const next = input.value.trim();
        if (!next) { alert('名称不能为空'); return; }
        if (next === old) return;
        renameSiteCat(old, next);
        renderManage();
      });

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'manage-del';
      del.textContent = '删除';
      del.addEventListener('click', () => removeSiteCat(old));

      row.append(input, save, del);
      container.appendChild(row);
    });
  }

  function renderManage() {
    const order = loadCatOrder();
    const used = [...new Set(sites.map(s => s.cat).filter(Boolean))];
    const cats = [...new Set([...order, ...used])];
    fillManage(catManage, cats);
  }

  btnTags.addEventListener('click', () => {
    renderManage();
    settingPanel.classList.remove('open');
    syncTab();
    tagPanel.classList.add('open');
  });

  btnTagBack.addEventListener('click', () => {
    tagPanel.classList.remove('open');
    settingPanel.classList.add('open');
    syncTab();
  });

  const newCat = document.getElementById('newCat');
  const btnAddCat = document.getElementById('btnAddCat');
  btnAddCat.addEventListener('click', () => {
    const name = newCat.value.trim();
    if (!name) return;
    const order = loadCatOrder();
    const used = sites.some(s => s.cat === name);
    if (order.includes(name) || used) { alert('该分类已存在'); return; }
    order.push(name);
    saveCatOrder(order);
    newCat.value = '';
    renderManage();
    renderChips();
  });

  // ===== 表单内直接新建 / 重命名站点分类 =====
  const fNewCat = document.getElementById('fNewCat');
  const btnAddCatForm = document.getElementById('btnAddCatForm');

  btnAddCatForm.addEventListener('click', () => {
    const name = fNewCat.value.trim();
    if (!name) { alert('请输入分类名称'); return; }
    const order = loadCatOrder();
    const used = sites.some(s => s.cat === name);
    if (!(order.includes(name) || used)) {
      order.push(name);
      saveCatOrder(order);
    }
    fNewCat.value = '';
    fillCatSelect(name);
    renderChips();
  });

  // ===== 模型分类管理：新增 / 改名 / 删除，同步到所有模型 =====
  function appendModelLine(cat) {
    const ta = document.getElementById('fModels');
    const line = `${cat} | 模型名 | 价格 | 按次`;
    ta.value = ta.value.trim() ? ta.value.replace(/\s*$/, '') + '\n' + line : line;
    ta.focus();
  }

  function removeModelCat(cat) {
    if (!confirm(`确定删除模型分类「${cat}」吗？\n用到该分类的模型会清空分类标签。`)) return;
    const list = loadModelCats().filter(c => c !== cat);
    sites.forEach(s => {
      s.models = s.models.map(m => m.tag === cat ? { ...m, tag: '' } : m);
    });
    saveModelCats(list);
    saveStorage();
    renderAll();
    renderModelCatPicks();
    renderModelCats();
  }

  function reorderModelCats() {
    const order = [...modelCatScroll.querySelectorAll('.model-cat-item')]
      .map(i => i.dataset.cat)
      .filter(Boolean);
    const list = loadModelCats();
    const kept = order.filter(c => list.includes(c));
    const rest = list.filter(c => !kept.includes(c));
    saveModelCats([...kept, ...rest]);
  }

  function reorderManageCats() {
    const order = [...modelCatManage.querySelectorAll('.manage-row')]
      .map(r => r.dataset.cat)
      .filter(Boolean);
    const list = loadModelCats();
    const kept = order.filter(c => list.includes(c));
    const rest = list.filter(c => !kept.includes(c));
    saveModelCats([...kept, ...rest]);
  }

  function reorderManageSiteCats() {
    const order = [...catManage.querySelectorAll('.manage-row')]
      .map(r => r.dataset.cat)
      .filter(Boolean);
    const list = loadCatOrder();
    const kept = order.filter(c => list.includes(c));
    const rest = list.filter(c => !kept.includes(c));
    saveCatOrder([...kept, ...rest]);
  }

  function renderModelCatPicks() {
    modelCatScroll.innerHTML = '';
    const cats = loadModelCats();

    // 已添加的分类：可点击选择；删除在设置弹窗内操作
    cats.forEach(cat => {
      const item = document.createElement('div');
      item.className = 'model-cat-item';
      item.dataset.cat = cat;

      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'model-cat-pick';
      chip.textContent = cat;
      chip.addEventListener('click', () => appendModelLine(cat));
      item.appendChild(chip);
      modelCatScroll.appendChild(item);
    });

    // 模型里已使用、但不在清单的分类：不可点击，仅展示
    const used = [...new Set(sites.flatMap(s => s.models.map(m => m.tag)).filter(t => t && !cats.includes(t)))];
    used.forEach(cat => {
      const item = document.createElement('div');
      item.className = 'model-cat-item';
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'model-cat-pick disabled';
      b.textContent = cat;
      b.disabled = true;
      item.appendChild(b);
      modelCatScroll.appendChild(item);
    });
  }

  btnAddModelCatPick.addEventListener('click', () => {
    renderModelCats();
    modelCatPanel.classList.add('open');
  });

  function renderModelCats() {
    const cats = loadModelCats();
    modelCatManage.innerHTML = '';
    if (!cats.length) {
      const empty = document.createElement('div');
      empty.style.color = 'var(--text-sub)';
      empty.style.fontSize = '13px';
      empty.textContent = '暂无分类，可在下方新增';
      modelCatManage.appendChild(empty);
      return;
    }
    cats.forEach(old => {
      const row = document.createElement('div');
      row.className = 'manage-row';
      row.dataset.cat = old;

      const input = document.createElement('input');
      input.className = 'manage-input';
      input.value = old;

      const save = document.createElement('button');
      save.type = 'button';
      save.className = 'link-btn manage-save';
      save.textContent = '保存';
      save.addEventListener('click', () => {
        const next = input.value.trim();
        if (!next) { alert('分类名不能为空'); return; }
        if (next === old) return;
        const list = loadModelCats();
        const i = list.indexOf(old);
        if (i > -1) {
          if (list.includes(next)) list.splice(i, 1);
          else list[i] = next;
        }
        sites.forEach(s => {
          s.models = s.models.map(m => m.tag === old ? { ...m, tag: next } : m);
        });
        saveModelCats(list);
        saveStorage();
        renderAll();
        renderModelCats();
      });

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'manage-del';
      del.textContent = '删除';
      del.addEventListener('click', () => removeModelCat(old));

      row.append(input, save, del);
      modelCatManage.appendChild(row);
    });
    renderModelCatPicks();
  }

  btnModelCats.addEventListener('click', () => {
    renderModelCats();
    settingPanel.classList.remove('open');
    syncTab();
    modelCatPanel.classList.add('open');
  });

  btnModelCatBack.addEventListener('click', () => {
    modelCatPanel.classList.remove('open');
  });

  btnAddModelCat.addEventListener('click', () => {
    const name = newModelCat.value.trim();
    if (!name) return;
    const list = loadModelCats();
    if (list.includes(name)) { alert('该分类已存在'); return; }
    list.push(name);
    saveModelCats(list);
    newModelCat.value = '';
    renderModelCats();
  });

  btnExport.addEventListener('click', () => {
    const payload = { sites, modelCats: loadModelCats(), exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `api-sites-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  btnImport.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const arr = Array.isArray(data) ? data : (data.sites || []);
        if (!Array.isArray(arr)) throw new Error('bad format');
        sites = arr.map(normalizeSite);
        if (Array.isArray(data.modelCats)) saveModelCats(data.modelCats);
        saveStorage();
        renderAll();
        renderModelCatPicks();
        alert(`导入成功，共 ${sites.length} 个站点`);
      } catch (err) {
        alert('导入失败：备份文件格式不正确');
      }
      fileInput.value = '';
    };
    reader.readAsText(file);
  });

  // ===== 首次加载：从本地存储恢复已保存的站点 =====
  const saved = loadStorage();
  sites = Array.isArray(saved) ? saved.map(normalizeSite) : [];
  renderAll();
  renderModelCatPicks();

  // ===== 点击飘心特效：大小/透明度不一，颜色跟随主题色 =====
  document.addEventListener('pointerdown', (e) => {
    const count = 6 + Math.floor(Math.random() * 3); // 6~8 个
    for (let i = 0; i < count; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart-fly';
      heart.textContent = '♥';
      const size = 12 + Math.random() * 14;          // 12~26px
      const opacity = 0.45 + Math.random() * 0.55;    // 0.45~1
      const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.6; // 环形均分+抖动
      const radius = 40 + Math.random() * 30;        // 散开半径 40~70px
      const ex = Math.cos(angle) * radius;
      const ey = Math.sin(angle) * radius;
      const dur = 0.5 + Math.random() * 0.3;          // 0.5~0.8s
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';
      heart.style.fontSize = size + 'px';
      heart.style.setProperty('--s', (size / 20).toFixed(2));
      heart.style.setProperty('--o', opacity.toFixed(2));
      heart.style.setProperty('--ex', ex.toFixed(0) + 'px');
      heart.style.setProperty('--ey', ey.toFixed(0) + 'px');
      heart.style.animationDuration = dur + 's';
      document.body.appendChild(heart);
      heart.addEventListener('animationend', () => heart.remove());
    }
  });
</script>
</body>
</html>
