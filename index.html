<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏小站</title>
    <style>
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: #fff0f5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 38.5c-1-1-9.5-8-9.5-14 0-3.5 2.5-5.5 5.5-5.5 2 0 3.5 1 4 2 0.5-1 2-2 4-2 3 0 5.5 2 5.5 5.5 0 6-8.5 13-9.5 14z' fill='%23ffb6c1' fill-opacity='0.3'/%3E%3C/svg%3E");
            background-attachment: fixed;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #5a4a4d;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: rgba(255, 255, 255, 0.85); border: 2px dashed #f3c5d2; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(243, 197, 210, 0.3); position: relative; backdrop-filter: blur(4px); }
        .profile-card { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #f3c5d2; background: #ffe4e8; display: flex; align-items: center; justify-content: center; font-size: 35px; box-shadow: 0 2px 8px rgba(243, 197, 210, 0.5); }
        .info h1 { margin: 0 0 5px 0; font-size: 22px; color: #3d2f31; display: flex; align-items: center; gap: 10px; }
        .info p { margin: 0 0 5px 0; font-size: 14px; color: #8c7a7e; }
        .info .subtitle { font-size: 13px; color: #b09a9e; display: flex; align-items: center; gap: 5px; }
        .card-header { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: bold; color: #d17b8e; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed #f3c5d2; }
        .project-list { display: flex; flex-direction: column; gap: 12px; }
        .project-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #fff; border: 1px solid #f3c5d2; border-radius: 8px; text-decoration: none; color: #5a4a4d; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .project-item:hover { background: #fff0f3; border-color: #e3a8b8; transform: translateX(5px); box-shadow: 0 4px 8px rgba(243, 197, 210, 0.4); }
        .project-name { display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .arrow { color: #d17b8e; font-weight: bold; }
        .placeholder-card { text-align: center; padding: 15px; font-size: 14px; color: #b09a9e; border: 1px dashed #f3c5d2; border-radius: 8px; background: rgba(255, 240, 243, 0.8); margin-top: 10px; }
        .deco-icon { position: absolute; top: 15px; right: 15px; font-size: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card profile-card">
        <div class="avatar">🐰</div>
        <div class="info">
            <h1>我的游戏小站</h1>
            <p>@jyx010320-gif</p>
            <div class="subtitle">✨ o北极兔o</div>
        </div>
    </div>

    <div class="card">
        <div class="deco-icon">🎀</div>
        <div class="card-header">
            <span>⚙️</span> ✨ 兔兔的奇妙口袋 ✨
        </div>
        
        <div class="project-list">
            <a href="BeatRabbit.html" class="project-item">
                <div class="project-name">🎵 节奏感应兔</div>
                <div class="arrow">➔</div>
            </a>

            <!-- 确认无空格：ClassicBlocks.html -->
            <a href="ClassicBlocks.html" class="project-item">
                <div class="project-name">🧱 经典俄罗斯方块</div>
                <div class="arrow">➔</div>
            </a>

            <!-- 确认无空格：FlowerMerge.html -->
            <a href="FlowerMerge.html" class="project-item">
                <div class="project-name">🌸 花卉合成</div>
                <div class="arrow">➔</div>
            </a>

            <!-- 确认无空格：FruitLink.html -->
            <a href="FruitLink.html" class="project-item">
                <div class="project-name">🍉 果园连连看</div>
                <div class="arrow">➔</div>
            </a>

            <a href="farm.html" class="project-item">
                <div class="project-name">🌾 农场小游戏</div>
                <div class="arrow">➔</div>
            </a>

            <a href="diary.html" class="project-item">
                <div class="project-name">📖 日记本</div>
                <div class="arrow">➔</div>
            </a>

            <a href="myapi.html" class="project-item">
                <div class="project-name">🔌 我的 API 测试</div>
                <div class="arrow">➔</div>
            </a>
        </div>

        <div class="placeholder-card">♡ 更多项目开发中，尽情期待 ♡</div>
    </div>
</div>

</body>
</html>
