<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-version" content="2026-11-24.5">
    <title>冻土游乐场</title>
    <style>
        /* ===== 十套配色：默认樱花粉，切换主题只换这里的变量 ===== */
        :root {
            --bg: #fff0f5;
            --pattern: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 38.5c-1-1-9.5-8-9.5-14 0-3.5 2.5-5.5 5.5-5.5 2 0 3.5 1 4 2 0.5-1 2-2 4-2 3 0 5.5 2 5.5 5.5 0 6-8.5 13-9.5 14z' fill='%23ffb6c1' fill-opacity='0.3'/%3E%3C/svg%3E");
            --line: #f3c5d2;
            --line-strong: #e3a8b8;
            --accent: #d17b8e;
            --accent-deep: #c9738a;
            --ink: #5a4a4d;
            --ink-strong: #3d2f31;
            --muted: #8c7a7e;
            --muted-light: #b09a9e;
            --soft: #ffe4e8;
            --soft-bg: #fff0f3;
            --placeholder-bg: rgba(255, 240, 243, 0.85);
            --glow: rgba(243, 197, 210, 0.4);
        }
        /* 1 糖霜粉：粉色底 + 灰色小圆点 */
        body.theme-sugar {
            --bg: #fff5f7;
            --pattern: url("data:image/svg+xml,%3Csvg width='18' height='18' viewBox='0 0 18 18' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='9' cy='9' r='2' fill='%23bfbfbf' fill-opacity='0.45'/%3E%3C/svg%3E");
            --line: #f5dbe2;
            --line-strong: #e3b4c2;
            --accent: #d17b8e;
            --accent-deep: #c9738a;
            --soft: #ffe9ef;
            --soft-bg: #fff7f9;
            --placeholder-bg: rgba(255, 247, 249, 0.85);
            --glow: rgba(243, 197, 210, 0.35);
        }
        /* 2 幸运绿：浅绿底 + 四叶草 */
        body.theme-clover {
            --bg: #f1fbf3;
            --pattern: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%239ed8a8' fill-opacity='0.4'%3E%3Ccircle cx='20' cy='13' r='5'/%3E%3Ccircle cx='20' cy='27' r='5'/%3E%3Ccircle cx='13' cy='20' r='5'/%3E%3Ccircle cx='27' cy='20' r='5'/%3E%3C/g%3E%3C/svg%3E");
            --line: #cde9d4;
            --line-strong: #a8d8b6;
            --accent: #6fbf8e;
            --accent-deep: #5aa87b;
            --soft: #e3f7e9;
            --soft-bg: #f4fcf6;
            --placeholder-bg: rgba(244, 252, 246, 0.85);
            --glow: rgba(158, 216, 168, 0.4);
        }
        /* 3 游鱼蓝：浅蓝底 + 小鱼 */
        body.theme-fish {
            --bg: #f0f8ff;
            --pattern: url("data:image/svg+xml,%3Csvg width='40' height='30' viewBox='0 0 40 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23a9ccf5' fill-opacity='0.5'%3E%3Cellipse cx='14' cy='15' rx='8' ry='5'/%3E%3Cpath d='M22 15l7-5v10z'/%3E%3C/g%3E%3C/svg%3E");
            --line: #cfe2f7;
            --line-strong: #a9c8e8;
            --accent: #77a8d8;
            --accent-deep: #6798c9;
            --soft: #e4f0fd;
            --soft-bg: #f5faff;
            --placeholder-bg: rgba(245, 250, 255, 0.85);
            --glow: rgba(169, 204, 245, 0.4);
        }
        /* 4 蛋奶黄：浅黄底 + 小蓝点 */
        body.theme-custard {
            --bg: #fffcee;
            --pattern: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='8' cy='8' r='2.2' fill='%23a9c8f2' fill-opacity='0.55'/%3E%3C/svg%3E");
            --line: #f4e5c3;
            --line-strong: #e4cf9a;
            --accent: #d4a95f;
            --accent-deep: #c49a4f;
            --soft: #fdf5dd;
            --soft-bg: #fffdf4;
            --placeholder-bg: rgba(255, 253, 244, 0.85);
            --glow: rgba(238, 220, 170, 0.45);
        }
        /* 5 薄荷棕：薄荷绿底 + 棕色小点 */
        body.theme-mint {
            --bg: #f0fbf8;
            --pattern: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='8' cy='8' r='2.2' fill='%23b08a6a' fill-opacity='0.5'/%3E%3C/svg%3E");
            --line: #cdeae1;
            --line-strong: #a6d6c8;
            --accent: #58ab93;
            --accent-deep: #4a9a83;
            --soft: #e3f7f2;
            --soft-bg: #f5fcfa;
            --placeholder-bg: rgba(245, 252, 250, 0.85);
            --glow: rgba(166, 214, 200, 0.4);
        }
        /* 6 蝴蝶粉：粉白竖条纹 + 粉色蝴蝶结 */
        body.theme-bow {
            --bg: #fff2f6;
            --pattern: url("data:image/svg+xml,%3Csvg width='48' height='48' viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffd9e2' fill-opacity='0.55'%3E%3Crect x='0' y='0' width='12' height='48'/%3E%3Crect x='24' y='0' width='12' height='48'/%3E%3C/g%3E%3Cg fill='%23f2a3bb' fill-opacity='0.7'%3E%3Cellipse cx='19' cy='24' rx='6' ry='3.6' transform='rotate(-25 19 24)'/%3E%3Cellipse cx='29' cy='24' rx='6' ry='3.6' transform='rotate(25 29 24)'/%3E%3Ccircle cx='24' cy='24' r='2.4'/%3E%3C/g%3E%3C/svg%3E");
            --line: #f5d3dd;
            --line-strong: #e9b2c2;
            --accent: #d97d97;
            --accent-deep: #c76d87;
            --soft: #ffe3ea;
            --soft-bg: #fff7f9;
            --placeholder-bg: rgba(255, 247, 249, 0.85);
            --glow: rgba(244, 178, 196, 0.4);
        }
        /* 7 海魂蓝：蓝白条纹交叉 */
        body.theme-sailor {
            --bg: #f7fafe;
            --pattern: repeating-linear-gradient(0deg, rgba(169, 200, 238, 0.4) 0px, rgba(169, 200, 238, 0.4) 8px, transparent 8px, transparent 16px), repeating-linear-gradient(90deg, rgba(169, 200, 238, 0.4) 0px, rgba(169, 200, 238, 0.4) 8px, transparent 8px, transparent 16px);
            --line: #dbe7f6;
            --line-strong: #b9cde6;
            --accent: #5f86b8;
            --accent-deep: #527aa9;
            --soft: #eaf1fb;
            --soft-bg: #f9fbff;
            --placeholder-bg: rgba(249, 251, 255, 0.85);
            --glow: rgba(185, 205, 230, 0.4);
        }
        /* 8 星砂米：米白底 + 大小不一的米棕星星 */
        body.theme-star {
            --bg: #faf6ef;
            --pattern: url("data:image/svg+xml,%3Csvg width='48' height='48' viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d8c3a5' fill-opacity='0.55'%3E%3Cpath d='M16 6L18.5 13.5L26 16L18.5 18.5L16 26L13.5 18.5L6 16L13.5 13.5Z'/%3E%3Cpath d='M38 29L39.2 33L43 34L39.2 35L38 39L36.8 35L33 34L36.8 33Z'/%3E%3Cpath d='M34 4L34.8 6.4L37 7L34.8 7.8L34 10L33.2 7.8L31 7L33.2 6.4Z'/%3E%3C/g%3E%3C/svg%3E");
            --line: #e9ddca;
            --line-strong: #d3bfa4;
            --accent: #c2a887;
            --accent-deep: #b29876;
            --soft: #f3ecdf;
            --soft-bg: #fbf8f1;
            --placeholder-bg: rgba(251, 248, 241, 0.85);
            --glow: rgba(216, 195, 165, 0.4);
        }
        /* 9 猫爪棕：牛皮质感 + 棕色猫爪 */
        body.theme-paw {
            --bg: #f7efe6;
            --pattern: url("data:image/svg+xml,%3Csvg width='48' height='48' viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d9bfa6' fill-opacity='0.22'%3E%3Ccircle cx='6' cy='6' r='2'/%3E%3Ccircle cx='42' cy='11' r='1.6'/%3E%3Ccircle cx='11' cy='43' r='1.8'/%3E%3Ccircle cx='38' cy='40' r='2.2'/%3E%3C/g%3E%3Cg fill='%23c8a382' fill-opacity='0.5'%3E%3Cellipse cx='24' cy='32' rx='8' ry='6'/%3E%3Ccircle cx='14' cy='21' r='3'/%3E%3Ccircle cx='20' cy='18' r='3'/%3E%3Ccircle cx='28' cy='18' r='3'/%3E%3Ccircle cx='34' cy='21' r='3'/%3E%3C/g%3E%3C/svg%3E");
            --line: #ecdcc9;
            --line-strong: #d6bfa5;
            --accent: #b08a63;
            --accent-deep: #9e7a55;
            --soft: #f4eadd;
            --soft-bg: #faf5ee;
            --placeholder-bg: rgba(250, 245, 238, 0.85);
            --glow: rgba(200, 163, 130, 0.4);
        }

        /* 基础设置：背景和字体 */
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: var(--bg);
            background-image: var(--pattern);
            background-attachment: fixed;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            display: flex;
            justify-content: center;
            transition: background-color 0.35s ease, color 0.35s ease;
        }
        /* 主容器 */
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* 统一的卡片样式（虚线边框，半透明白底能看到背景图案） */
        .card {
            background: rgba(255, 255, 255, 0.86);
            border: 2px dashed var(--line);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px var(--glow);
            position: relative;
            backdrop-filter: blur(4px);
            transition: border-color 0.35s ease, box-shadow 0.35s ease;
        }
        /* 顶部个人信息卡片（右侧留出按钮的位置） */
        .profile-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-right: 62px;
            min-height: 152px;
            box-sizing: border-box;
            z-index: 10;
        }
        /* 头像 */
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: var(--soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            box-shadow: 0 2px 8px var(--glow);
            transition: border-color 0.35s ease, background 0.35s ease;
        }
        .info h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: var(--ink-strong);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info p {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: var(--muted);
        }
        .info .subtitle {
            font-size: 13px;
            color: var(--muted-light);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* 项目列表卡片头部 */
        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--line);
        }
        /* 项目列表：一行两个（两列网格） */
        .project-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        /* 分类小标题：横跨两列，右侧拖一条渐隐虚线 */
        .section-title {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent-deep);
        }
        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--line), transparent);
        }
        /* 第二个分类标题上方留一点空，和上一组项目分开 */
        .section-title.gap {
            margin-top: 6px;
        }
        /* 单个项目按钮：左边文字两行，右边箭头 */
        .project-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding: 10px 10px 9px;
            min-height: 56px;
            box-sizing: border-box;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            text-decoration: none;
            color: var(--ink);
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            min-width: 0;
        }
        .project-item:hover {
            background: var(--soft-bg);
            border-color: var(--line-strong);
            transform: translateY(-3px);
            box-shadow: 0 4px 8px var(--glow);
        }
        /* 想临时让某一项通栏时，加这个类 */
        .project-item.wide {
            grid-column: 1 / -1;
        }
        /* 文字区：主标题 + 类型小字 */
        .project-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }
        .project-name {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            font-size: 14px;
            line-height: 1.3;
            min-width: 0;
        }
        /* 类型小字：浅一号的灰，字号小、字距略松 */
        .project-type {
            font-size: 11px;
            line-height: 1.2;
            color: var(--muted-light);
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .arrow {
            color: var(--accent);
            font-weight: bold;
            flex-shrink: 0;
        }
        /* 占位提示卡片：通栏顶两个格子，单独占满一行放在最底下 */
        .placeholder-card {
            grid-column: 1 / -1;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: var(--muted-light);
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: var(--placeholder-bg);
        }

        /* 备份弹层里的按钮 */
        .backup-btn {
            flex: 1;
            min-width: 96px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--line-strong);
            background: #fff;
            color: var(--accent-deep);
            font-size: 12.5px;
            font-family: inherit;
            line-height: 1.2;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }
        .backup-btn:hover {
            background: var(--soft-bg);
        }
        .backup-btn:active {
            transform: scale(0.97);
        }

        /* 备份弹层 */
        .backup-mask {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: rgba(60, 45, 50, 0.35);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .backup-mask.show {
            opacity: 1;
            pointer-events: auto;
        }
        .backup-panel {
            width: 100%;
            max-width: 420px;
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            border-radius: 14px;
            border: 2px dashed var(--line);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 12px 30px var(--glow);
            transform: translateY(10px) scale(0.98);
            transition: transform 0.25s ease;
        }
        .backup-mask.show .backup-panel {
            transform: translateY(0) scale(1);
        }
        .backup-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-deep);
        }
        .backup-head button {
            border: none;
            background: transparent;
            color: var(--muted-light);
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            font-family: inherit;
        }
        .backup-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            overflow: auto;
        }
        .backup-desc {
            margin: 0;
            font-size: 11.5px;
            line-height: 1.7;
            color: var(--muted);
        }
        .backup-body textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 120px;
            max-height: 34vh;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--soft-bg);
            color: var(--ink);
            font-family: Consolas, Menlo, monospace;
            font-size: 11px;
            line-height: 1.6;
            resize: vertical;
        }
        .backup-body .backup-btn {
            flex: 1;
        }
        .backup-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 更新提示条：固定在顶部，默认藏在视口上方 */
        .update-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--soft);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 4px 12px var(--glow);
            font-size: 13px;
            color: var(--accent-deep);
            transform: translateY(-110%);
            transition: transform 0.35s ease, background 0.35s ease;
        }
        .update-banner.show {
            transform: translateY(0);
        }
        .update-banner .banner-text {
            flex: 1;
            min-width: 0;
        }
        .update-banner .refresh-btn {
            flex-shrink: 0;
            border: none;
            border-radius: 999px;
            padding: 6px 14px;
            background: var(--line-strong);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.25s ease;
        }
        .update-banner .refresh-btn:hover {
            background: var(--accent);
        }
        .update-banner .close-btn {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: var(--muted-light);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 4px;
        }

        /* 右上角四个文字按钮，竖排一列：刷新、配色、导出、导入 */
        .refresh-fab,
        .palette-fab,
        .export-fab,
        .import-fab {
            position: absolute;
            right: 10px;
            z-index: 2;
            width: 44px;
            height: 26px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
            color: var(--accent);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            line-height: 1;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 2px 6px var(--glow);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, border-color 0.3s ease, color 0.25s ease;
        }
        .refresh-fab {
            top: 12px;
            right: 10px;
        }
        .palette-fab {
            top: 46px;
            right: 10px;
        }
        .export-fab {
            top: 80px;
            right: 10px;
        }
        .import-fab {
            top: 114px;
            right: 10px;
        }
        .refresh-fab:hover,
        .palette-fab:hover,
        .export-fab:hover,
        .import-fab:hover {
            background: var(--soft-bg);
            color: var(--accent-deep);
            border-color: var(--line-strong);
            transform: translateY(-1px);
            box-shadow: 0 4px 9px var(--glow);
        }
        .refresh-fab:active,
        .palette-fab:active,
        .export-fab:active,
        .import-fab:active {
            transform: scale(0.96);
        }

        /* 配色选择面板：从四个按钮下方弹出 */
        .palette-panel {
            position: absolute;
            top: 148px;
            right: 10px;
            z-index: 20;
            width: 208px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 8px 22px var(--glow);
            opacity: 0;
            transform: translateY(-8px) scale(0.97);
            transform-origin: top right;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .palette-panel.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .palette-title {
            font-size: 11px;
            color: var(--muted-light);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

<script>
    (function () {
        var meta = document.querySelector('meta[name="app-version"]');
        var current = meta ? meta.getAttribute('content') : '';
        var banner = document.getElementById('update-banner');
        var bannerText = document.getElementById('banner-text');
        var refreshBtn = document.getElementById('refresh-btn');
        var closeBtn = document.getElementById('close-btn');
        var refreshFab = document.getElementById('refresh-fab');
        var paletteFab = document.getElementById('palette-fab');
        var palettePanel = document.getElementById('palette-panel');
        var paletteOptions = document.querySelectorAll('.palette-option');
        var toast = document.getElementById('refresh-toast');
        var toastText = document.getElementById('refresh-time-text');
        var toastTimer = null;
        var shown = false;

        /* 十套配色 */
        var THEMES = [
            { key: 'sugar', name: '糖霜粉' },
            { key: 'clover', name: '幸运绿' },
            { key: 'fish', name: '游鱼蓝' },
            { key: 'custard', name: '蛋奶黄' },
            { key: 'mint', name: '薄荷棕' },
            { key: 'bow', name: '蝴蝶粉' },
            { key: 'sailor', name: '海魂蓝' },
            { key: 'star', name: '星砂米' },
            { key: 'paw', name: '猫爪棕' },
            { key: 'sakura', name: '樱花粉' }
        ];
        var THEME_KEY = 'site-theme';

        /* 时间格式化成 14:32:05 */
        function formatTime(ts) {
            var d = new Date(ts);
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }

        /* 顶部悬浮框，3 秒后自动收起 */
        function showToast(text) {
            toastText.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toast.classList.remove('show');
            }, 3000);
        }

        /* 面板里高亮当前配色 */
        function syncActiveOption(key) {
            for (var i = 0; i < paletteOptions.length; i++) {
                var isActive = paletteOptions[i].getAttribute('data-theme') === key;
                paletteOptions[i].classList.toggle('active', isActive);
            }
        }

        /* 应用配色主题 */
        function applyTheme(key) {
            THEMES.forEach(function (t) {
                document.body.classList.remove('theme-' + t.key);
            });
            document.body.classList.add('theme-' + key);
            syncActiveOption(key);
        }

        /* 启动时恢复上次选的配色 */
        var savedTheme = null;
        try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
        var themeIndex = 0;
        THEMES.forEach(function (t, i) {
            if (t.key === savedTheme) { themeIndex = i; }
        });
        applyTheme(THEMES[themeIndex].key);

        /* 配色按钮：点一下打开 / 收起配色面板 */
        if (paletteFab) {
            paletteFab.addEventListener('click', function (e) {
                e.stopPropagation();
                palettePanel.classList.toggle('show');
            });
        }

        /* 点某一块配色：切换并记住，然后收起面板 */
        for (var oi = 0; oi < paletteOptions.length; oi++) {
            paletteOptions[oi].addEventListener('click', function () {
                var key = this.getAttribute('data-theme');
                THEMES.forEach(function (t, i) {
                    if (t.key === key) { themeIndex = i; }
                });
                applyTheme(key);
                try { localStorage.setItem(THEME_KEY, key); } catch (e) {}
                showToast('🎨 已切换 · ' + THEMES[themeIndex].name);
                palettePanel.classList.remove('show');
            });
        }

        /* 点面板以外的地方自动收起 */
        document.addEventListener('click', function (e) {
            if (!palettePanel.classList.contains('show')) { return; }
            if (palettePanel.contains(e.target)) { return; }
            if (paletteFab && paletteFab.contains(e.target)) { return; }
            palettePanel.classList.remove('show');
        });

        /* 刷新按钮：把点击时间写进地址，重载后读出来显示 */
        if (refreshFab) {
            refreshFab.addEventListener('click', function () {
                var url = new URL(location.href);
                url.searchParams.set('r', Date.now());
                location.replace(url.toString());
            });
        }

        /* 刚点过刷新（15 秒内）的话，进页面就把时间弹出来 */
        (function () {
            var r = new URL(location.href).searchParams.get('r');
            if (!r) { return; }
            var ts = Number(r);
            if (!ts || Date.now() - ts > 15000) { return; }
            showToast('🔄 已刷新 · ' + formatTime(ts));
        })();

        /* ================= 存档备份：导出 / 导入 ================= */
        var BACKUP_TIME_KEY = 'site-backup-time';
        var backupMask = document.getElementById('backup-mask');
        var backupPanelTitle = document.getElementById('backup-panel-title');
        var backupClose = document.getElementById('backup-close');
        var exportView = document.getElementById('backup-export-view');
        var importView = document.getElementById('backup-import-view');
        var exportText = document.getElementById('export-text');
        var exportDesc = document.getElementById('export-desc');
        var importText = document.getElementById('import-text');
        var fileInput = document.getElementById('file-input');
        var exportBtn = document.getElementById('export-btn');
        var importBtn = document.getElementById('import-btn');
        var copyBtn = document.getElementById('copy-btn');
        var downloadBtn = document.getElementById('download-btn');
        var pickFileBtn = document.getElementById('pick-file-btn');
        var doImportBtn = document.getElementById('do-import-btn');

        function two(n) { return n < 10 ? '0' + n : '' + n; }

        /* 2026-11-25 01:20，用于记录上次备份时间 */
        function stampNow() {
            var d = new Date();
            return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate())
                + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
        }

        /* 20261125-0120，用于下载文件名 */
        function stampFile() {
            var d = new Date();
            return '' + d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate())
                + '-' + two(d.getHours()) + two(d.getMinutes());
        }

        /* 取上次备份时间 */
        function lastBackupTime() {
            var t = null;
            try { t = localStorage.getItem(BACKUP_TIME_KEY); } catch (e) {}
            return t;
        }

        /* 把本网站所有 localStorage 键值收成一个对象 */
        function collectSaves() {
            var obj = {};
            var n = localStorage.length;
            for (var i = 0; i < n; i++) {
                var k = localStorage.key(i);
                obj[k] = localStorage.getItem(k);
            }
            return obj;
        }

        function buildBackupText() {
            var items = collectSaves();
            var count = 0;
            for (var k in items) {
                if (Object.prototype.hasOwnProperty.call(items, k)) { count++; }
            }
            return {
                count: count,
                text: JSON.stringify({
                    app: '冻土游乐场',
                    version: current,
                    exportedAt: new Date().toISOString(),
                    count: count,
                    items: items
                }, null, 2)
            };
        }

        function openBackup(title, mode) {
            backupPanelTitle.textContent = title;
            exportView.style.display = (mode === 'export') ? 'flex' : 'none';
            importView.style.display = (mode === 'import') ? 'flex' : 'none';
            backupMask.classList.add('show');
        }

        function closeBackup() {
            backupMask.classList.remove('show');
        }

        /* 导出：生成 JSON，同时支持复制和下载 */
        if (exportBtn) {
            exportBtn.addEventListener('click', function () {
                var r = buildBackupText();
                exportText.value = r.text;
                var last = lastBackupTime();
                exportDesc.textContent = '共 ' + r.count + ' 项存档，' + stampNow()
                    + ' 打包完成。' + (last ? '上次备份：' + last + '。' : '还没有备份记录。')
                    + '可以复制保存，或者直接下载 .json 文件。';
                openBackup('导出存档', 'export');
            });
        }

        /* 打开导入面板 */
        if (importBtn) {
            importBtn.addEventListener('click', function () {
                importText.value = '';
                fileInput.value = '';
                openBackup('导入存档', 'import');
            });
        }

        if (backupClose) {
            backupClose.addEventListener('click', closeBackup);
        }
        if (backupMask) {
            backupMask.addEventListener('click', function (e) {
                if (e.target === backupMask) { closeBackup(); }
            });
        }

        /* 复制到剪贴板：不行就退回到选中文本让用户手动复制 */
        if (copyBtn) {
            copyBtn.addEventListener('click', function () {
                var txt = exportText.value;
                function done(ok) {
                    showToast(ok ? '📋 已复制到剪贴板' : '⚠️ 复制失败，请长按文本框手动复制');
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt)
                        .then(function () { done(true); })
                        .catch(function () {
                            try {
                                exportText.focus();
                                exportText.select();
                                done(document.execCommand('copy'));
                            } catch (err) { done(false); }
                        });
                } else {
                    try {
                        exportText.focus();
                        exportText.select();
                        done(document.execCommand('copy'));
                    } catch (err) { done(false); }
                }
            });
        }

        /* 下载 .json */
        if (downloadBtn) {
            downloadBtn.addEventListener('click', function () {
                try {
                    var blob = new Blob([exportText.value], { type: 'application/json' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = '冻土游乐场存档-' + stampFile() + '.json';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(function () {
                        URL.revokeObjectURL(url);
                        if (a.parentNode) { a.parentNode.removeChild(a); }
                    }, 600);
                    try { localStorage.setItem(BACKUP_TIME_KEY, stampNow()); } catch (e) {}
                    showToast('⬇ 已发出下载请求');
                } catch (err) {
                    showToast('⚠️ 这里不支持下载，请用「复制」');
                }
            });
        }

        /* 选择备份文件，读成文本放进输入框 */
        if (pickFileBtn && fileInput) {
            pickFileBtn.addEventListener('click', function () {
                fileInput.click();
            });
            fileInput.addEventListener('change', function () {
                var f = this.files && this.files[0];
                if (!f) { return; }
                var reader = new FileReader();
                reader.onload = function () {
                    importText.value = String(reader.result || '');
                    showToast('📂 已读入 ' + f.name);
                };
                reader.onerror = function () {
                    showToast('⚠️ 文件读取失败');
                };
                reader.readAsText(f);
            });
        }

        /* 执行导入 */
        if (doImportBtn) {
            doImportBtn.addEventListener('click', function () {
                var raw = (importText.value || '').trim();
                if (!raw) {
                    showToast('⚠️ 先选文件或粘贴备份内容');
                    return;
                }
                var data = null;
                try {
                    data = JSON.parse(raw);
                } catch (e) {
                    showToast('⚠️ 这不是有效的 JSON 备份');
                    return;
                }
                var items = (data && data.items) ? data.items : data;
                if (!items || typeof items !== 'object') {
                    showToast('⚠️ 备份内容格式不对');
                    return;
                }
                var keys = [];
                for (var k in items) {
                    if (Object.prototype.hasOwnProperty.call(items, k)) { keys.push(k); }
                }
                if (!keys.length) {
                    showToast('⚠️ 这份备份里没有存档');
                    return;
                }
                var tip = '将导入 ' + keys.length + ' 项存档，同名的会被覆盖。\n建议先导出一份当前的存档备份。\n确定继续吗？';
                if (!window.confirm(tip)) { return; }

                var ok = 0;
                var bad = 0;
                for (var bi = 0; bi < keys.length; bi++) {
                    var key = keys[bi];
                    var val = items[key];
                    if (typeof val !== 'string') {
                        try { val = JSON.stringify(val); } catch (e2) { val = String(val); }
                    }
                    try {
                        localStorage.setItem(key, val);
                        ok++;
                    } catch (e3) {
                        bad++;
                    }
                }
                try { localStorage.setItem(BACKUP_TIME_KEY, stampNow()); } catch (e4) {}
                closeBackup();
                showToast('✅ 已导入 ' + ok + ' 项' + (bad ? '，' + bad + ' 项空间不足' : '') + '，正在刷新');
                setTimeout(function () { location.reload(); }, 1200);
            });
        }

        /* 本地双击打开（file://）时浏览器不允许读 json，直接跳过更新检测 */
        if (!current || location.protocol === 'file:') {
            return;
        }

        /* 更新提示条里的刷新：同样记录时间，重载后弹时间框 */
        refreshBtn.addEventListener('click', function () {
            var url = new URL(location.href);
            url.searchParams.set('r', Date.now());
            location.href = url.toString();
        });

        /* 关闭提示条 */
        closeBtn.addEventListener('click', function () {
            banner.classList.remove('show');
        });

        /* 拉取 version.json，比对版本号 */
        function checkUpdate() {
            fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) { throw new Error('no version.json'); }
                    return res.json();
                })
                .then(function (data) {
                    if (shown || !data || !data.version) { return; }
                    if (data.version !== current) {
                        shown = true;
                        bannerText.textContent = '小站更新到 ' + data.version + ' 啦，刷新看新版';
                        banner.classList.add('show');
                    }
                })
                .catch(function () {
                    /* 没上传 version.json 或网络失败时静默忽略 */
                });
        }

        /* 进页面先查一次，之后每 60 秒查一次，切回标签页时再查一次 */
        checkUpdate();
        setInterval(checkUpdate, 60000);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { checkUpdate(); }
        });
    })();
</script>
</body>
</html>
