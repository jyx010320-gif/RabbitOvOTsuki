<!DOCTYPE html>
<html lang="zh-CN" data-scheme="s10">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8C6B5D">
<title>拾词 · 单词档案</title>
<style>
/* ================= 设计变量 ================= */
:root{
  --paper:#F7F2E7;
  --paper-2:#FFFCF4;
  --ink:#4A3A33;
  --ink-2:#7C695D;
  --muted:#A29286;
  --bar:#8C6B5D;
  --bar-2:#775548;
  --line:#E7D9C7;
  --line-strong:#D6C2AC;
  --pink:#F1E1CD;
  --pink-line:#CAA88E;
  --blue:#DCEAE7;
  --blue-line:#A9C4BE;
  --mint:#E1EBDA;
  --rose:#A97A62;
  --bad:#BE7A6A;
  --bad-bg:#F7DCD3;
  --bad-ink:#8B4030;
  --bad-line:#CE9280;
  --mid-bg:#F8E8D0;
  --mid-ink:#7B5620;
  --mid-line:#CDA87A;
  --good-bg:#DEEAD6;
  --good-ink:#3F6246;
  --good-line:#91AC8A;
  --mid:#C2965B;
  --good:#7E9A7C;
  --shadow:0 10px 24px -20px rgba(120,80,60,.65);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r-lg:16px;
  --r-md:13px;
  --r-sm:9px;
  --paper-pattern:
    radial-gradient(circle at 3px 3px, rgba(203,164,134,.5) 1.4px, transparent 1.6px),
    radial-gradient(circle at 3px 3px, rgba(160,192,186,.5) 1.4px, transparent 1.6px);
  --pattern-size:22px 22px, 22px 22px;
  --pattern-pos:0 0, 11px 11px;
}
[data-theme="dark"]{
  --paper:#1F1916;
  --paper-2:#2A2220;
  --ink:#F1E6D6;
  --ink-2:#C6B5A4;
  --muted:#95816F;
  --bar:#4B3A33;
  --bar-2:#3B2C26;
  --line:rgba(241,230,214,.14);
  --line-strong:rgba(241,230,214,.26);
  --pink:#3A2E24;
  --pink-line:#7C6150;
  --blue:#233230;
  --blue-line:#5B7C76;
  --mint:#2A3128;
  --rose:#D8A98F;
  --bad:#DE9A88;
  --bad-bg:rgba(222,148,128,.2);
  --bad-ink:#F5B9A8;
  --bad-line:rgba(222,148,128,.6);
  --mid-bg:rgba(216,177,120,.18);
  --mid-ink:#EBCB96;
  --mid-line:rgba(216,177,120,.55);
  --good-bg:rgba(155,193,155,.18);
  --good-ink:#C1DEBF;
  --good-line:rgba(155,193,155,.55);
  --mid:#D8B178;
  --good:#9BC19B;
  --shadow:0 10px 24px -18px rgba(0,0,0,.8);
}

/* ================= 十套配色 ================= */
/* 1 樱灰点 */
[data-scheme="s1"]{
  --paper:#FBE9EE; --paper-2:#FFF8FA;
  --ink:#4A3A40; --ink-2:#7A666E; --muted:#A2919A;
  --bar:#8C6E77; --bar-2:#755860;
  --line:rgba(150,110,120,.18); --line-strong:rgba(150,110,120,.34);
  --pink:#F5E0E6; --pink-line:#CDA9B3; --rose:#A87787;
  --paper-pattern:radial-gradient(circle at 3px 3px, rgba(150,140,146,.55) 1.4px, transparent 1.6px);
  --pattern-size:20px 20px; --pattern-pos:0 0;
}
/* 2 四叶青 */
[data-scheme="s2"]{
  --paper:#EAF3E2; --paper-2:#F8FCEF;
  --ink:#3B4536; --ink-2:#65725D; --muted:#94A08B;
  --bar:#61784F; --bar-2:#4C6140;
  --line:rgba(110,130,95,.2); --line-strong:rgba(110,130,95,.36);
  --pink:#E6F0D6; --pink-line:#ABC192; --rose:#7C9060;
  --paper-pattern:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><g fill='%237a9a5f' fill-opacity='.36'><circle cx='17' cy='17' r='6'/><circle cx='29' cy='17' r='6'/><circle cx='17' cy='29' r='6'/><circle cx='29' cy='29' r='6'/></g></svg>");
  --pattern-size:48px 48px; --pattern-pos:0 0;
}
/* 3 蓝鱼游 */
[data-scheme="s3"]{
  --paper:#E5F2F6; --paper-2:#F6FCFD;
  --ink:#32454B; --ink-2:#5D747A; --muted:#8AA1A8;
  --bar:#4E6E79; --bar-2:#3D5964;
  --line:rgba(90,130,145,.2); --line-strong:rgba(90,130,145,.36);
  --pink:#DAEBF1; --pink-line:#9CBEC8; --rose:#5B8AA0;
  --paper-pattern:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='46'><g fill='%234e6e79' fill-opacity='.3'><ellipse cx='30' cy='23' rx='9' ry='5.5'/><path d='M21 23l-7-5.5v11z'/></g></svg>");
  --pattern-size:64px 46px; --pattern-pos:0 0;
}
/* 4 黄蓝点 */
[data-scheme="s4"]{
  --paper:#FCF2D6; --paper-2:#FFFCF0;
  --ink:#4A3F2C; --ink-2:#78684B; --muted:#A2916F;
  --bar:#7E6A43; --bar-2:#675437;
  --line:rgba(140,115,70,.2); --line-strong:rgba(140,115,70,.36);
  --pink:#F8ECC8; --pink-line:#CBB581; --rose:#A87C38;
  --paper-pattern:radial-gradient(circle at 3px 3px, rgba(95,140,185,.5) 1.5px, transparent 1.7px);
  --pattern-size:17px 17px; --pattern-pos:0 0;
}
/* 5 薄荷棕 */
[data-scheme="s5"]{
  --paper:#E7F2EB; --paper-2:#F8FDF9;
  --ink:#37443D; --ink-2:#61736A; --muted:#8EA098;
  --bar:#7D5B47; --bar-2:#654636;
  --line:rgba(140,110,90,.2); --line-strong:rgba(140,110,90,.36);
  --pink:#E3EFE8; --pink-line:#A9C6B6; --rose:#8B6B53;
  --paper-pattern:radial-gradient(circle at 3px 3px, rgba(150,110,85,.42) 1.4px, transparent 1.6px);
  --pattern-size:21px 21px; --pattern-pos:0 0;
}
/* 6 粉白结 */
[data-scheme="s6"]{
  --paper:#FBE9EF; --paper-2:#FFFAFC;
  --ink:#4C3A43; --ink-2:#7A6571; --muted:#A893A0;
  --bar:#A97287; --bar-2:#8E5A6E;
  --line:rgba(170,120,140,.2); --line-strong:rgba(170,120,140,.36);
  --pink:#F9E0E8; --pink-line:#D6A9BB; --rose:#B07A8E;
  --paper-pattern:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='68' height='52'><g fill='%23c98aa0' fill-opacity='.4'><path d='M34 24l-13-8v16z'/><path d='M34 24l13-8v16z'/><circle cx='34' cy='24' r='4.2'/></g></svg>"),
    repeating-linear-gradient(90deg, #FBE9EF 0 16px, #FFF8FB 16px 32px);
  --pattern-size:68px 52px, 32px 100%; --pattern-pos:0 0, 0 0;
}
/* 7 蓝白格 */
[data-scheme="s7"]{
  --paper:#E8F1F7; --paper-2:#F9FCFE;
  --ink:#32434D; --ink-2:#5C7180; --muted:#88A0B0;
  --bar:#4C6E86; --bar-2:#3B5A70;
  --line:rgba(90,125,150,.2); --line-strong:rgba(90,125,150,.36);
  --pink:#DFEDF6; --pink-line:#A3C2D5; --rose:#5A85A5;
  --paper-pattern:
    repeating-linear-gradient(90deg, rgba(120,160,190,.32) 0 12px, transparent 12px 26px),
    repeating-linear-gradient(0deg, rgba(120,160,190,.32) 0 12px, transparent 12px 26px);
  --pattern-size:26px 26px, 26px 26px; --pattern-pos:0 0, 0 0;
}
/* 8 米棕星 */
[data-scheme="s8"]{
  --paper:#FAF4E9; --paper-2:#FFFDF6;
  --ink:#4A4034; --ink-2:#786B5A; --muted:#A2937F;
  --bar:#7B6150; --bar-2:#634C3D;
  --line:rgba(140,115,90,.2); --line-strong:rgba(140,115,90,.36);
  --pink:#F6EDDD; --pink-line:#CDB794; --rose:#A07C56;
  --paper-pattern:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><g fill='%237b6150' fill-opacity='.34'><path d='M15 6l2.3 6.2 6.2 2.3-6.2 2.3L15 22.6l-2.3-6.2L6.5 14.3l6.2-2.3z'/><path d='M50 42l3.1 8.4 8.4 3.1-8.4 3.1-3.1 8.4-3.1-8.4-8.4-3.1 8.4-3.1z'/></g></svg>");
  --pattern-size:72px 72px; --pattern-pos:0 0;
}
/* 9 牛皮爪 */
[data-scheme="s9"]{
  --paper:#E6D3B8; --paper-2:#FBF1DF;
  --ink:#4A3823; --ink-2:#7A6448; --muted:#9C8666;
  --bar:#6F5136; --bar-2:#5A4029;
  --line:rgba(110,80,50,.24); --line-strong:rgba(110,80,50,.4);
  --pink:#EEDCC0; --pink-line:#C0A47D; --rose:#8E6A42;
  --paper-pattern:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><g fill='%236f5136' fill-opacity='.32'><ellipse cx='30' cy='36' rx='9' ry='7.5'/><circle cx='19' cy='24' r='4.2'/><circle cx='26' cy='19' r='4.2'/><circle cx='34' cy='19' r='4.2'/><circle cx='41' cy='24' r='4.2'/></g></svg>"),
    repeating-linear-gradient(45deg, rgba(150,110,70,.1) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(-45deg, rgba(120,85,55,.08) 0 2px, transparent 2px 7px);
  --pattern-size:60px 60px, 6px 6px, 7px 7px; --pattern-pos:0 0, 0 0, 0 0;
}
/* 10 樱花粉（现有） */
[data-scheme="s10"]{
  --paper-pattern:
    radial-gradient(circle at 3px 3px, rgba(203,164,134,.5) 1.4px, transparent 1.6px),
    radial-gradient(circle at 3px 3px, rgba(160,192,186,.5) 1.4px, transparent 1.6px);
  --pattern-size:22px 22px, 22px 22px; --pattern-pos:0 0, 11px 11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{touch-action:manipulation;-ms-touch-action:manipulation}
.doodle svg,.petal svg{pointer-events:none}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  background:#EDE5D7;
  background:color-mix(in srgb, var(--paper), #6B5446 18%);
  transition:background .3s;
}

/* ================= 外壳：奶油波点纸 ================= */
.app{
  position:relative;overflow:hidden;
  width:min(430px,100vw);height:100dvh;max-height:940px;
  border-radius:18px;
  background-color:var(--paper);
  background-image:var(--paper-pattern);
  background-size:var(--pattern-size);
  background-position:var(--pattern-pos);
  box-shadow:0 30px 70px -40px rgba(90,60,45,.7);
  transition:background-color .3s;
}
@media (max-width:520px){
  .app{border-radius:0;max-height:none;height:100dvh}
  body{background:#EDE5D7}
  [data-theme="dark"] body{background:#141010}
}

/* ================= 顶部蕾丝封头 ================= */
.appbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:6;
  background:var(--bar);
  color:#FBF3E4;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;
  box-shadow:0 2px 0 rgba(255,255,255,.06) inset;
}
/* 蕾丝扇边 */
.appbar::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:9px;
  background:radial-gradient(circle at 9px 0, var(--bar) 8px, transparent 8.5px) repeat-x;
  background-size:18px 9px;
  pointer-events:none;
}
.ab-title{position:absolute;left:50%;transform:translateX(-50%);text-align:center;line-height:1}
.ab-title b{display:block;font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.1em;color:#FBF3E4}
.ab-title span{display:block;margin-top:3px;font-size:8.5px;letter-spacing:.3em;opacity:.62}
.ab-icon,.ab-home{
  border:1px solid rgba(251,243,228,.35);
  background:rgba(251,243,228,.08);
  color:#FBF3E4;cursor:pointer;
  border-radius:20px;
  backdrop-filter:blur(6px);
  transition:transform .16s,background .2s;
}
.ab-icon{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto}
.ab-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.ab-home{
  display:flex;align-items:center;gap:4px;padding:5px 10px;
  font-size:10px;letter-spacing:.12em;font-family:var(--sans);
  flex:0 0 auto;
}
.ab-home svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ab-icon:active,.ab-home:active{transform:scale(.94);background:rgba(251,243,228,.18)}
.ab-mark{width:30px;height:30px;flex:0 0 auto;position:relative;display:block}
.ab-mark::before{
  content:'';position:absolute;left:4px;top:4px;width:22px;height:22px;
  border-radius:50%;border:1px solid rgba(251,243,228,.5);
}
.ab-mark::after{
  content:'';position:absolute;left:9px;top:9px;width:12px;height:12px;
  border-radius:50%;background:rgba(251,243,228,.55);
}

/* ================= 通用排版 ================= */
#view{position:absolute;top:54px;bottom:0;left:0;right:0;z-index:2}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:20px 18px calc(96px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
  animation:fadeUp .32s cubic-bezier(.22,.9,.32,1) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.dayline{display:flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.dayline .sep{width:1px;height:9px;background:var(--line-strong)}
.dayline .streak{color:var(--rose);letter-spacing:.04em}
.greet{
  font-family:var(--serif);font-weight:500;
  font-size:26px;line-height:1.34;letter-spacing:.02em;
  margin:11px 0 20px;
}
.greet em{font-style:normal;color:var(--bar);font-size:31px;letter-spacing:0}
.mini-label{font-size:9.5px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}

.label{
  display:flex;align-items:center;gap:9px;
  margin:24px 0 11px;
}
.label .chip{
  padding:3px 8px;border-radius:5px;
  border:1px dashed var(--pink-line);
  background:rgba(255,252,244,.72);
  font-size:9.5px;letter-spacing:.18em;color:var(--bar);
  text-transform:uppercase;white-space:nowrap;
}
.label .sp{flex:1;height:1px;background:var(--line);min-width:8px}
.label a{
  color:var(--ink-2);text-decoration:none;font-size:10.5px;letter-spacing:.1em;cursor:pointer;
  border-bottom:1px dashed var(--line-strong);padding-bottom:1px;
}

/* 纸张卡片 */
.paper{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
}
.paper.stitch{position:relative}
.paper.stitch::after{
  content:'';position:absolute;inset:5px;border-radius:11px;
  border:1px dashed rgba(180,140,130,.28);pointer-events:none;
}
[data-theme="dark"] .paper.stitch::after{border-color:rgba(240,210,180,.14)}

/* ================= 首页 ================= */
.hero{padding:20px 20px 18px;position:relative}
.hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.hero-num{font-family:var(--serif);font-size:39px;line-height:1;margin:10px 0 6px;color:var(--ink)}
.hero-num .unit{font-size:14px;color:var(--muted);font-family:var(--sans);letter-spacing:.04em}
.hero-sub{font-size:11.5px;color:var(--ink-2);margin:0}
.ring{width:88px;height:88px;position:relative;flex:0 0 auto}
.ring svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:rgba(200,168,140,.35);stroke-width:6}
.ring-fg{fill:none;stroke:url(#rg);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;color:var(--ink-2)}
.ring-num span{font-size:9px;margin-left:1px;transform:translateY(1px);color:var(--muted)}

.hero-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  margin:18px 0 16px;padding-top:14px;
  border-top:1px dashed var(--line-strong);
}
.hero-grid > div{display:flex;flex-direction:column;gap:3px}
.hero-grid > div + div{border-left:1px dashed var(--line);padding-left:14px}
.hero-grid b{font-family:var(--serif);font-size:18px;font-weight:500}
.hero-grid span{font-size:10px;color:var(--muted);letter-spacing:.08em}

.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:48px;border:0;cursor:pointer;
  border-radius:11px;
  background:linear-gradient(180deg,var(--bar) 0%,var(--bar-2) 100%);
  color:#FBF3E4;font-family:var(--sans);font-size:14.5px;font-weight:600;letter-spacing:.16em;
  box-shadow:0 6px 0 -3px rgba(90,60,45,.35), inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .16s,filter .2s;
}
.btn-primary:active{transform:translateY(1px) scale(.99);filter:brightness(1.06)}
.btn-primary svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  padding:14px 15px 13px;border-radius:var(--r-md);cursor:pointer;
  background:var(--paper-2);border:1px dashed var(--pink-line);
  box-shadow:var(--shadow);transition:transform .16s;
}
.tile:active{transform:scale(.985)}
.tile .t-num{font-family:var(--serif);font-size:22px;margin:0 0 2px}
.tile .t-label{font-size:11px;color:var(--muted);letter-spacing:.08em}
.tile .t-sub{font-size:10.5px;color:var(--rose);margin-top:6px}

.week{display:flex;gap:7px}
.week i{
  flex:1;aspect-ratio:1;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:10.5px;color:var(--muted);
  background:rgba(255,252,244,.7);border:1px dashed var(--line-strong);
}
.week i.on{
  background:var(--pink);border-color:var(--pink-line);color:var(--bar-2);font-weight:600;
}
.week i.today{box-shadow:inset 0 0 0 1.4px var(--rose)}
[data-theme="dark"] .week i.on{color:var(--ink)}

.row{
  display:flex;align-items:center;justify-content:space-between;gap:11px;
  padding:14px 16px;margin-bottom:9px;cursor:pointer;
  background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:var(--shadow);
  transition:transform .16s;
}
.row:active{transform:scale(.992)}
.row-main{display:flex;flex-direction:column;gap:4px}
.row-name{font-size:13.5px;font-weight:600;letter-spacing:.03em}
.row-desc{font-size:11px;color:var(--muted)}
.chev{width:7px;height:7px;border-right:1.4px solid var(--muted);border-bottom:1.4px solid var(--muted);transform:rotate(-45deg);flex:0 0 auto;margin-right:3px}

/* ================= 背词页 ================= */
.study{display:flex;flex-direction:column;height:100%}
.study-head{display:flex;align-items:center;gap:12px;margin:2px 0 20px}
.icon-btn{
  width:32px;height:32px;flex:0 0 auto;cursor:pointer;border-radius:50%;
  border:1px dashed var(--line-strong);background:var(--paper-2);
  display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow);
}
.icon-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.bar{flex:1;height:5px;border-radius:4px;background:rgba(214,194,172,.4);overflow:hidden}
.bar span{
  display:block;height:100%;border-radius:4px;
  background:repeating-linear-gradient(90deg,var(--bar) 0 8px,var(--rose) 8px 16px);
  transition:width .35s cubic-bezier(.2,.9,.3,1);
}
.count{font-size:10.5px;color:var(--muted);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.card-stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}

.flip-card{perspective:1500px;cursor:pointer;height:min(48vh,360px);min-height:280px}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-lg);padding:18px 20px;
  display:flex;flex-direction:column;
  background:var(--paper-2);
  border:1.5px dashed var(--pink-line);
  box-shadow:0 14px 26px -20px rgba(120,80,60,.7);
}
.face.back{
  transform:rotateY(180deg);
  background:var(--blue);
  border:1.5px dashed var(--blue-line);
}
[data-theme="dark"] .face.back{background:var(--blue)}
.face-top{display:flex;justify-content:space-between;align-items:center}
.tag{
  font-size:9px;letter-spacing:.18em;
  padding:3px 8px;border-radius:5px;
  background:var(--pink);color:var(--bar-2);
  border:1px dashed var(--pink-line);
}
.face.back .tag{background:rgba(255,252,244,.6);color:var(--ink-2);border-color:var(--blue-line)}
[data-theme="dark"] .tag{background:var(--pink);color:var(--ink)}
[data-theme="dark"] .face.back .tag{background:rgba(255,255,255,.08);color:var(--ink-2)}
.no{font-size:9px;letter-spacing:.2em;color:var(--muted)}
.word{
  font-family:var(--serif);font-weight:500;
  font-size:min(12.5vw,48px);line-height:1.12;letter-spacing:-.012em;
  margin:auto 0 0;word-break:break-word;
}
.word .lead{color:var(--rose)}
.word.mid{font-size:min(9.2vw,35px)}
.word.long{font-size:min(6.6vw,25px);letter-spacing:-.02em}
.phon{display:flex;align-items:center;gap:8px;margin:12px 0 0;color:var(--ink-2);font-size:12px}
.phon button{
  border:0;background:transparent;cursor:pointer;color:var(--bar);
  display:grid;place-items:center;padding:2px;
}
.phon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.hint{
  margin-top:auto;padding-top:14px;font-size:10px;color:var(--muted);
  letter-spacing:.12em;display:flex;align-items:center;gap:7px;
}
.hint::before{content:'';width:15px;height:1px;background:var(--line-strong)}

.def-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:22px}
.def-word{font-family:var(--serif);font-size:21px}
.def-phon{font-size:11px;color:var(--ink-2);opacity:.8}
.pos{
  display:inline-block;font-size:10px;letter-spacing:.16em;
  color:var(--rose);margin:14px 0 6px;text-transform:lowercase;
}
.def-text{
  font-size:16px;line-height:1.6;font-family:var(--serif);color:var(--ink);
  white-space:pre-line;overflow-y:auto;flex:1 1 auto;min-height:0;padding-right:2px;
  scrollbar-width:none;
}
.def-text::-webkit-scrollbar{display:none}
.eg{margin-top:auto;padding-top:13px;border-top:1px dashed var(--blue-line)}
.eg p{margin:0 0 4px;font-family:var(--serif);font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.eg p.cn{font-family:var(--sans);font-size:11px;color:var(--muted)}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;transition:opacity .3s}
.actions.locked{opacity:.55;pointer-events:none}
.act{
  height:52px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line-strong);
  background:var(--paper-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--sans);font-size:14.5px;font-weight:700;letter-spacing:.08em;color:var(--ink);
  box-shadow:0 6px 14px -12px rgba(120,80,60,.9);
  transition:transform .14s,background .18s,filter .2s;
}
.act:active{transform:scale(.97);filter:brightness(.98)}
.act small{font-size:9.5px;font-weight:500;letter-spacing:.16em;color:currentColor;opacity:.62}
.act.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
.act.mid{background:var(--mid-bg);color:var(--mid-ink);border-color:var(--mid-line)}
.act.good{background:var(--good-bg);color:var(--good-ink);border-color:var(--good-line)}

/* 学习模式：听写 / 选择 / 默写 */
.modes{
  display:flex;gap:5px;padding:4px;margin-bottom:16px;
  border:.5px dashed var(--line-strong);border-radius:11px;
  background:rgba(255,252,244,.65);
}
.mode{
  flex:1;height:28px;border:0;border-radius:8px;background:transparent;cursor:pointer;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;color:var(--ink-2);
  transition:background .2s,color .2s;
}
.mode.active{background:var(--bar);color:#FBF3E4;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.task-card{
  position:relative;min-height:306px;padding:18px 20px;
  display:flex;flex-direction:column;
  border-radius:var(--r-lg);background:var(--paper-2);
  border:1.5px dashed var(--pink-line);
  box-shadow:0 14px 26px -20px rgba(120,80,60,.7);
}
.task-top{display:flex;justify-content:space-between;align-items:center}
.speaker{
  width:88px;height:88px;margin:26px auto 0;border-radius:50%;cursor:pointer;
  border:1.5px dashed var(--pink-line);background:var(--pink);color:var(--bar-2);
  display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 10px 22px -16px rgba(120,80,60,.8);
  transition:transform .16s;
}
.speaker:active{transform:scale(.96)}
.speaker svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.5}
.task-tip{margin:16px 0 0;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.1em}
.type-input{  width:100%;height:54px;margin-top:14px;text-align:center;
  font-family:var(--serif);font-size:28px;letter-spacing:.06em;color:var(--ink);
  background:transparent;border:0;border-bottom:1.5px dashed var(--line-strong);outline:none;
  -webkit-user-select:text;user-select:text;
}
.type-input.search-input{
  height:46px;font-size:15px;text-align:left;letter-spacing:.02em;
  margin:6px 0 4px;padding:0 2px;font-family:var(--sans);
}
.type-input.search-input::placeholder{font-size:12px;letter-spacing:.06em}
.type-input::placeholder{font-size:12.5px;letter-spacing:.1em;color:var(--muted);font-family:var(--sans)}
.spell-def{
  font-family:var(--serif);font-size:22px;line-height:1.55;text-align:center;
  margin:22px 0 0;color:var(--ink);white-space:pre-line;
  max-height:210px;overflow-y:auto;scrollbar-width:none;
}
.spell-def::-webkit-scrollbar{display:none}
.verdict{margin-top:14px;padding:10px 12px;border-radius:10px;border:.5px dashed;font-size:11.5px}
.verdict.ok{border-color:var(--good-line);background:var(--good-bg);color:var(--good-ink)}
.verdict.no{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-ink)}
.verdict b{display:block;font-size:12.5px;margin-bottom:3px;letter-spacing:.06em}
.verdict p{margin:0;font-family:var(--serif);font-size:12.5px;line-height:1.5;color:var(--ink)}
.vp{color:var(--muted);font-size:10.5px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  width:100%;text-align:left;padding:13px 15px;cursor:pointer;
  border:.5px solid var(--line-strong);border-radius:11px;background:var(--paper-2);
  font-family:var(--sans);font-size:12.5px;color:var(--ink);box-shadow:var(--shadow);
  transition:transform .14s,background .18s;
}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--good-line);background:var(--good-bg);color:var(--good-ink)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-ink)}
.opt.dim{opacity:.45}
.choice-head{margin-bottom:2px}

/* 设置页：圆形图标 */
.ic-round{
  width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  border:1px dashed var(--line-strong);background:var(--pink);
  display:grid;place-items:center;color:var(--bar-2);
}
.ic-round svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.finish{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;height:100%;justify-content:center}
.doodle{color:var(--bar);opacity:.85;width:104px;margin-bottom:4px}
.doodle svg{width:100%;height:auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.finish .big{font-family:var(--serif);font-size:42px;line-height:1.1;margin:4px 0 0}
.finish p{color:var(--muted);font-size:11.5px;margin:2px 0 0}
.finish .stats{display:flex;gap:26px;margin:24px 0 28px}
.finish .stats div{display:flex;flex-direction:column;gap:3px}
.finish .stats b{font-family:var(--serif);font-size:22px;font-weight:500}
.finish .stats span{font-size:9.5px;color:var(--muted);letter-spacing:.16em}

/* ================= 词库 / 记录 ================= */
.page-title{font-family:var(--serif);font-size:26px;margin:4px 0 5px;font-weight:500}
.page-sub{font-size:11.5px;color:var(--muted);margin:0 0 20px}

.lib-card{
  padding:16px;border-radius:var(--r-md);margin-bottom:10px;cursor:pointer;
  background:var(--paper-2);border:1px solid var(--line);
  box-shadow:var(--shadow);transition:transform .16s,border-color .2s;
}
.lib-card:active{transform:scale(.992)}
.lib-card.active{border:1.5px dashed var(--pink-line);background:var(--paper-2)}
.lib-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.lib-name{font-family:var(--serif);font-size:18px;margin:0 0 4px;font-weight:500}
.lib-meta{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.pill{
  font-size:9px;padding:3px 9px;border-radius:5px;letter-spacing:.16em;
  background:var(--bar);color:#FBF3E4;
}
.pill.plain{background:transparent;border:1px dashed var(--line-strong);color:var(--muted)}
.import{
  border:1.5px dashed var(--line-strong);border-radius:var(--r-md);
  padding:18px;text-align:center;cursor:pointer;background:rgba(255,252,244,.6);
  color:var(--muted);font-size:11.5px;
}
.import b{display:block;color:var(--ink-2);font-size:12.5px;font-weight:600;margin-bottom:3px}

.sum{display:flex;gap:10px}
.sum-card{flex:1;padding:16px;border-radius:var(--r-md);background:var(--paper-2);border:1px solid var(--line);box-shadow:var(--shadow)}
.sum-card b{display:block;font-family:var(--serif);font-size:25px;line-height:1.2;font-weight:500}
.sum-card span{font-size:9.5px;color:var(--muted);letter-spacing:.16em}

.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:12px 2px 0;margin-top:4px}
.chart.labels{height:auto;padding:2px 2px 0;margin-top:0}
.chart-card{
  background:var(--paper-2);
  border:.5px solid var(--line);
  border-radius:14px;
  padding:8px 10px 6px;
  box-shadow:var(--shadow);
}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .col i{
  display:block;width:100%;border-radius:5px 5px 2px 2px;min-height:4px;
  background:repeating-linear-gradient(45deg,rgba(203,164,134,.55) 0 3px,rgba(255,252,244,.5) 3px 6px);
  border:1px solid rgba(203,164,134,.5);
  transition:height .4s;
}
.chart .col.hi i{background:var(--bar);border-color:var(--bar-2);opacity:.85}
.chart .col b{font-size:10px;color:var(--muted);font-weight:500}
.legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.legend span{font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:block}
.split{height:9px;border-radius:4px;overflow:hidden;display:flex;background:rgba(214,194,172,.35);margin:8px 0 3px}
.split > i{display:block;height:100%}

/* ================= 设置 ================= */
.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 15px;margin-bottom:9px;
  background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:var(--shadow);
}
.set-row .s-name{font-size:13px;letter-spacing:.02em}
.set-row .s-desc{font-size:10px;color:var(--muted);margin-top:2px}
.seg{display:flex;gap:5px;flex:0 0 auto}
.seg button{
  padding:6px 11px;border-radius:9px;cursor:pointer;
  border:.5px solid var(--line-strong);background:var(--paper);
  font-size:12px;color:var(--ink-2);letter-spacing:.04em;
}
.seg button.on{background:var(--bar);border-color:var(--bar);color:#FFFBF4}
.stepper{display:flex;align-items:center;border:1px dashed var(--line-strong);border-radius:9px;overflow:hidden;background:rgba(255,252,244,.7)}
.stepper button{width:28px;height:28px;border:0;background:transparent;color:var(--bar);font-size:15px;cursor:pointer;line-height:1}
.stepper input{width:32px;border:0;background:transparent;text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink);outline:none}
.switch{
  width:44px;height:25px;border-radius:20px;border:1px dashed var(--line-strong);position:relative;cursor:pointer;
  background:rgba(214,194,172,.35);transition:background .2s;flex:0 0 auto;
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:var(--paper-2);transition:transform .22s;box-shadow:0 1px 3px rgba(90,60,45,.3);
}
.switch.on{background:var(--bar);border-color:var(--bar-2)}
.switch.on::after{transform:translateX(19px);background:#FBF3E4}
.ghost-btn{
  width:100%;height:44px;border-radius:11px;cursor:pointer;
  border:1px dashed var(--line-strong);background:rgba(255,252,244,.65);
  color:var(--ink-2);font-size:12px;letter-spacing:.1em;margin-bottom:9px;
  font-family:var(--sans);
}
.ghost-btn:active{transform:scale(.992)}
.footnote{font-size:10px;color:var(--muted);line-height:1.9;margin-top:20px;text-align:center;letter-spacing:.08em}

/* ================= 配色选择 ================= */
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.swatch{
  display:flex;align-items:center;gap:9px;padding:8px;cursor:pointer;text-align:left;
  background:var(--paper-2);border:.5px solid var(--line);border-radius:11px;
  font-family:var(--sans);box-shadow:var(--shadow);
  transition:transform .16s;
}
.swatch:active{transform:scale(.98)}
.swatch.active{border:1.5px solid var(--bar);border-width:1.5px}
.swatch .sw-face{
  width:36px;height:36px;border-radius:8px;flex:0 0 auto;position:relative;overflow:hidden;
  background-color:var(--paper);background-image:var(--paper-pattern);
  background-size:var(--pattern-size);background-position:var(--pattern-pos);
  border:.5px solid rgba(0,0,0,.08);
}
.swatch .sw-face::after{content:'';position:absolute;left:0;right:0;bottom:0;height:9px;background:var(--bar)}
.swatch .sw-name{display:block;font-size:11.5px;color:var(--ink);letter-spacing:.04em}
.swatch .sw-id{display:block;font-size:8px;color:var(--muted);letter-spacing:.16em;margin-top:2px}

/* ================= 底部导航 ================= */
.tabbar{
  position:absolute;z-index:5;left:0;right:0;bottom:0;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  border-radius:20px 20px 0 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.46) 0%, rgba(255,255,255,.12) 46%, rgba(255,255,255,.26) 100%),
    color-mix(in srgb, var(--paper-2) 58%, transparent);
  border:.5px solid rgba(255,255,255,.6);
  border-bottom:0;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 -1px 0 rgba(255,255,255,.25),
    0 -18px 42px -26px rgba(70,45,35,.45);
  backdrop-filter: blur(26px) saturate(180%);
  -webkit-backdrop-filter: blur(26px) saturate(180%);
}
.tabbar::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(90% 60% at 18% -10%, rgba(255,255,255,.55), rgba(255,255,255,0) 62%),
    radial-gradient(60% 40% at 82% 110%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
  opacity:.7;
}
.tabbar > *{position:relative;z-index:1}
[data-theme="dark"] .tabbar{background:var(--paper-2);box-shadow:0 -8px 18px -16px rgba(0,0,0,.8)}
.tab{
  border:0;background:transparent;cursor:pointer;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 0 3px;color:var(--muted);font-size:9.5px;letter-spacing:.12em;
  font-family:var(--sans);transition:color .2s,background .2s;
}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.active{
  color:var(--bar-2);
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.26));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 0 0 .5px rgba(255,255,255,.55),
    0 4px 10px -8px rgba(80,50,40,.55);
}
.tab.active svg{stroke-width:1.9}
[data-theme="dark"] .tab.active{color:var(--ink)}

/* 内部图形的轮廓：一律 0.5px */
.paper,.row,.tile,.lib-card,.sum-card,.set-row,.import,.face,
.week i,.tag,.chip,.stepper,.switch,.ghost-btn,.icon-btn,.ab-icon,.ab-home{border-width:.5px}
.tabbar{border-top-width:.5px}
</style>
</head>

const FREQ_RANKS = (function(){
  try{ return JSON.parse(document.getElementById('freqbank').textContent || '{}'); }catch(e){ return {}; }
})();
function freqRank(word){
  const key = String(word).toLowerCase();
  if(FREQ_RANKS[key]) return FREQ_RANKS[key];
  const base = key.split(/[\s\-\/]/)[0];
  return FREQ_RANKS[base] || 0;
}
function freqLabel(word){
  const r = freqRank(word);
  if(!r) return '进阶词 · 未在 1 万高频表内';
  if(r <= 1000) return '核心高频 · 前 1000';
  if(r <= 3000) return '高频 · 前 3000';
  if(r <= 6000) return '常用 · 前 6000';
  return '一般 · 前 10000';
}
function freqStars(word){
  const r = freqRank(word);
  if(!r) return '';
  if(r <= 1000) return '★★★';
  if(r <= 3000) return '★★';
  return '★';
}

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function loadDB(){
  try{
    const d = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
    if(d && d.v === 1) return d;
  }catch(e){}
  return {v:1, cursor:{cet4:0, cet6:0}, log:{}, words:{}, streak:{last:'', days:0}};
}

function touchStreak(){
  const t = todayStr();
  if(DB.streak.last === t) return;
  DB.streak.days = (DB.streak.last === addDays(t, -1)) ? (DB.streak.days || 0) + 1 : 1;
  DB.streak.last = t;
}
function bumpLog(kind){
  const t = todayStr();
  const lg = DB.log[t] || (DB.log[t] = {new:0, rev:0});
  if(kind) lg[kind] = (lg[kind] || 0) + 1;

function masteredCount(){

  Object.keys(DB.words).forEach(function(k){
    const r = DB.words[k];

  });

}
function wrongWords(){
  const out = [];

    if(r && r.wrong > 0) out.push({w:w, rank:r.wrong, lvl:r.lvl, due:r.due});
  });
  return out.sort((a,b) => b.rank - a.rank);
}
function buildBackup(){
  return {
    v:1, exported:todayStr(), db:DB,
    prefs:{scheme:S.scheme, accent:S.settings.accent, autoSpeak:S.settings.autoSpeak, shuffle:S.settings.shuffle}
  };

function exportData(){
  try{

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '拾词备份-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); }, 800);
  }catch(e){}
}
function importData(file){
  const fr = new FileReader();
  fr.onload = function(){ applyBackup(fr.result); };

}
function applyBackup(text){
  if(!window.confirm('导入会覆盖这台设备上现有的学习进度，确定继续？')) return false;
  try{
    const p = JSON.parse(text);
    const d = p.db || p;
    if(!d || !d.words) throw new Error('bad backup');
    DB = d;
    DB.v = 1;
    if(!DB.cursor) DB.cursor = {cet4:0, cet6:0};
    if(!DB.log) DB.log = {};
    if(!DB.streak) DB.streak = {last:'', days:0};
    if(p.prefs){
      if(p.prefs.scheme) S.scheme = p.prefs.scheme;
      if(p.prefs.accent) S.settings.accent = p.prefs.accent;
      if(typeof p.prefs.autoSpeak === 'boolean') S.settings.autoSpeak = p.prefs.autoSpeak;
      if(typeof p.prefs.shuffle === 'boolean') S.settings.shuffle = p.prefs.shuffle;
      savePrefs();
    }
    saveDB();
    resetSessionState();
    S.queue = [];
    S.screen = 'home';
    render();
    alert('备份已导入');
    return true;
  }catch(e){
    alert('这份备份读不出来，确认是拾词导出的内容');
    return false;
  }
}

/* ---------- 语音：自动挑系统里最好的英文音色 ---------- */
let VOICES = [];
function loadVoices(){
  try{ VOICES = window.speechSynthesis ? speechSynthesis.getVoices() : []; }catch(e){ VOICES = []; }
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = function(){
    loadVoices();
    if(S.screen === 'settings') render();
  };
}
const VOICE_PREF = {
  'en-US': [/Natural/i, /Aria/i, /Jenny/i, /Guy/i, /Samantha/i, /Alex/i, /Google US English/i, /Zira/i, /David/i, /Mark/i],
  'en-GB': [/Natural/i, /Libby/i, /Sonia/i, /Ryan/i, /Google UK English Female/i, /Hazel/i, /Serena/i, /Daniel/i, /Kate/i]
};
function voiceLang(){ return S.settings.accent === 'uk' ? 'en-GB' : 'en-US'; }
function bestVoice(lang){
  if(!VOICES.length) loadVoices();
  const norm = v => (v.lang || '').replace('_','-').toLowerCase();
  let pool = VOICES.filter(v => norm(v).startsWith(lang.toLowerCase()));
  if(!pool.length) pool = VOICES.filter(v => norm(v).startsWith('en'));
  if(!pool.length) return null;
  for(const re of VOICE_PREF[lang] || []){
    const hit = pool.find(v => re.test(v.name || ''));
    if(hit) return hit;
  }
  const local = pool.filter(v => v.localService);
  return local[0] || pool[0];
}
function voiceSupported(){
  return !!window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined';
}
let global_speakWarned = false;
function voiceName(){
  if(!voiceSupported()) return '当前浏览器不支持朗读，可用系统浏览器打开';
  const v = bestVoice(voiceLang());
  return v ? v.name : '系统默认音色';
}
function speak(text){
  try{
    if(!voiceSupported()){
      if(!global_speakWarned){
        global_speakWarned = true;
        alert('当前浏览器没有朗读能力，这个词暂时只能看音标。用系统浏览器打开网页版可以发音。');
      }
      return;
    }
    const lang = voiceLang();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.9;
    const v = bestVoice(lang);
    if(v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

function curWord(){
  if(S.phase==='final' && S.wrong.length) return S.wrong[Math.min(S.idx, S.wrong.length-1)];

function shortDef(d){
  const first = String(d||'').split('\n')[0];

}

function choiceOptions(w){
  const n = WORDS.length;
  const base = S.idx * 13;
  const picked = [];
  for(let i=1; picked.length<3 && i<n; i++){
    const x = WORDS[(base + i*37) % n];
    if(!x || x.w === w.w) continue;
    if(picked.some(l => l.trim() === x.def.trim())) continue;
    picked.push(x.def);
  }
  const list = [w.def].concat(picked);
  const rot = S.idx % 4;
  return list.slice(rot).concat(list.slice(0,rot));
}

function viewChoice(w){

  const cls = (o,i)=>{
    if(!S.checked) return '';
    if(i===S.picked) return S.result?'correct':'wrong';
    if(o===w.def) return 'correct';
    return 'dim';
  };
  return `<div class="card-stage">

    </div>

    ${taskActions()}

function gradeWord(w, grade){
  if(!w || w.graded) return;
  w.graded = true;
  const k = keyOf(w);
  let r = DB.words[k];
  const isNew = !r;
  if(!r) r = DB.words[k] = {lvl:0, seen:0, wrong:0, due:todayStr()};
  r.seen = (r.seen || 0) + 1;
  if(grade === 'bad'){
    r.wrong = (r.wrong || 0) + 1;
    r.lvl = Math.max(0, (r.lvl || 0) - 1);
    r.due = todayStr();
  }else if(grade === 'mid'){
    r.lvl = Math.min(6, (r.lvl || 0) + 1);
    r.due = addDays(todayStr(), INTERVALS[r.lvl] || 1);
  }else{
    r.lvl = Math.min(6, (r.lvl || 0) + 2);
    r.due = addDays(todayStr(), INTERVALS[Math.min(6, r.lvl)] || 1);
  }
  bumpLog(isNew ? 'new' : 'rev');
  bumpLog(grade === 'bad' ? 'bad' : 'ok');
  touchStreak();
  saveDB();
}

function normAnswer(s){
  return String(s||'').trim().toLowerCase().replace(/[^a-z\-' ]/g,'');
}

function checkTask(){
  if(S.checked && !S.retry) return;
  const w = curWord();
  if(S.mode==='choice'){
    S.result = choiceOptions(w)[S.picked] === w.def;
    S.checked = true;
    gradeWord(w, S.result ? 'good' : 'bad');
    return;
  }
  if(normAnswer(S.answer) === normAnswer(w.w)){
    S.result = true; S.checked = true; S.retry = false;
    gradeWord(w, 'good');
  }else{
    S.result = false; S.checked = true;
    if(!S.retry){
      S.retry = true;
      if(S.phase === 'main' && !S.wrong.some(x => x.w === w.w)) S.wrong.push(w);
    }
    S.answer = '';
    gradeWord(w, 'bad');
  }
}

function nextWord(){
  S.idx++;
  S.answer=''; S.picked=-1; S.checked=false; S.result=false; S.flipped=false; S.retry=false;
  if(S.phase === 'main' && S.idx >= S.queue.length && S.wrong.length){
    S.phase = 'final'; S.idx = 0;
  }
  render();
  if(S.mode==='dictation' && S.idx < (S.phase==='final' ? S.wrong.length : S.queue.length)) speak(curWord().w);
}

function setMode(mode){
  S.mode = mode;
  S.answer=''; S.picked=-1; S.checked=false; S.result=false; S.flipped=false; S.retry=false;
  render();
  if(mode==='dictation' && S.idx < (S.phase==='final' ? S.wrong.length : 20)) speak(curWord().w);
}

function bookLearned(id){
  let n = 0;
  Object.keys(DB.words).forEach(function(k){ if(k.indexOf(id + '|') === 0) n++; });
  return n;
}
function searchList(q){
  const s = String(q || '').trim().toLowerCase();
  if(!s) return '';
  const hits = [];
  for(let i=0;i<WORDS.length && hits.length<24;i++){
    const w = WORDS[i];
    const low = w.w.toLowerCase();
    if(low.indexOf(s) === 0 || (s.length > 1 && low.indexOf(s) > -1)) hits.push(w);
  }
  if(!hits.length) return '<div class="footnote">没有匹配的词</div>';
  return hits.map(function(w){
    return `<div class="row" data-act="word:${encodeURIComponent(w.w)}">
      <div class="row-main">
        <span class="row-name">${w.w}</span>
        <span class="row-desc">${shortDef(w.def)}</span>
      </div>
      <span class="chev"></span>
    </div>`;
  }).join('');
}
function wrongListHtml(){
  const list = wrongWords();
  if(!list.length) return '<div class="footnote">还没有错词，继续保持。</div>';
  return list.slice(0, 8).map(function(item){
    return `<div class="row" data-act="word:${encodeURIComponent(item.w.w)}">

}

const FILTERS = [
  ['all','全部'], ['new','未学'], ['fuzzy','模糊'], ['known','已掌握'], ['wrong','错词']

function inFilter(w, f){
  const r = DB.words[keyOf(w)];
  if(S.letter && String(w.w).toLowerCase().indexOf(S.letter.toLowerCase()) !== 0) return false;
  if(f === 'new') return !r;
  if(f === 'wrong') return !!(r && r.wrong > 0);
  if(f === 'known') return !!(r && r.lvl >= 4);
  if(f === 'fuzzy') return !!(r && r.lvl < 4);
  return true;
}
function browseList(){
  const f = S.filter;
  const out = [];
  let n = 0;
  for(let i=0;i<WORDS.length && out.length < S.listLimit;i++){
    const w = WORDS[i];
    if(!inFilter(w, f)) continue;
    n++;
    const r = DB.words[keyOf(w)];
    const st = !r ? '未学' : (r.lvl >= 4 ? '已掌握' : (r.lvl >= 2 ? '模糊' : '待加固'));
    out.push(`<div class="row" data-act="word:${encodeURIComponent(w.w)}">

        <span class="row-name">${w.w}<span style="font-size:10px;color:var(--muted);margin-left:8px">${st}</span>${freqStars(w.w) ? `<span style="font-size:10px;color:var(--bar);margin-left:6px">${freqStars(w.w)}</span>` : ''}</span>
        <span class="row-desc">${shortDef(w.def)}</span>
      </div>
      <span class="chev"></span>
    </div>`);
  }
  const total = (function(){
    let c = 0;
    for(let i=0;i<WORDS.length;i++){ if(inFilter(WORDS[i], f)) c++; }
    return c;
  })();
  return `${out.join('')}
    ${total > S.listLimit ? `<button class="ghost-btn" data-act="more">加载更多（${S.listLimit}/${total}）</button>` : `<div class="footnote">共 ${num(total)} 个词</div>`}`;
}

/* ---------- 视图：阶段测验 ---------- */
let quizTimer = null;
function fmtTime(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/60) + ':' + pad2(s%60);
}
function stopClock(){ if(quizTimer){ clearInterval(quizTimer); quizTimer = null; } }
function startClock(){
  stopClock();
  quizTimer = setInterval(function(){
    const el = document.getElementById('quiz-clock');
    if(!el || !S.quiz || S.quiz.state !== 'run') return;
    const used = Math.floor((Date.now() - S.quiz.t0)/1000);
    const left = S.quiz.limit - used;
    el.textContent = fmtTime(Math.max(0, left));
    if(left <= 0){ finishQuiz(); }
  }, 500);
}
function quizPool(){
  const pool = [];
  WORDS.forEach(function(w){
    const r = DB.words[keyOf(w)];
    if(r && r.seen > 0) pool.push(w);
  });
  return pool;
}
function quizOpts(w, pool){
  const picked = [];
  let guard = 0;
  while(picked.length < 3 && guard < 400){
    guard++;
    const x = pool[Math.floor(Math.random()*pool.length)];
    if(!x || x.w === w.w) continue;
    if(picked.some(function(d){ return d.trim() === String(x.def).trim(); })) continue;
    picked.push(x.def);
  }
  return shuffleArr([w.def].concat(picked));
}
function startQuiz(size){
  const pool = quizPool();
  const src = pool.length >= 40 ? pool : WORDS;
  const copy = shuffleArr(src.slice()).slice(0, Math.min(size, src.length));
  const items = copy.map(function(w){
    return {w:w.w, us:w.us, uk:w.uk, def:w.def, pos:w.pos, tag:w.tag, opts:quizOpts(w, src)};
  });
  S.quiz = {state:'run', idx:0, correct:0, picked:-1, answered:false, lastOk:false, t0:Date.now(), limit:size*15, items:items, wrongs:[]};
  S.screen = 'quiz';
  startClock();
  render();
}
function finishQuiz(){
  const q = S.quiz;
  q.state = 'done';
  q.seconds = Math.max(1, Math.floor((Date.now() - q.t0)/1000));
  stopClock();
  if(!DB.quiz) DB.quiz = {history:[]};
  DB.quiz.history.push({d:todayStr(), book:S.book, total:q.items.length, correct:q.correct, sec:q.seconds});
  if(DB.quiz.history.length > 30) DB.quiz.history = DB.quiz.history.slice(-30);
  saveDB();
  render();
}

    return `<div class="screen">

      <div class="choice-head">

      </div>

      </div>
      ${q.answered ? `<div class="verdict ${q.lastOk?'ok':'no'}"><b>${q.lastOk?'✓ 对了':'✕ 选错了'}</b><p>${it.w} <span class="vp">${phonOf(it)}</span> · ${shortDef(it.def)}</p></div>` : ''}
      ${q.answered ? `<button class="btn-primary" data-act="quiznext">${q.idx+1 >= total ? '看结果' : '下一题'} <svg viewBox="0 0 24 24">${ICON.arrow}</svg></button>` : `<button class="ghost-btn" data-act="quizskip">跳过这题</button>`}

  const total = q.items.length;

  const best = hist.length ? Math.max.apply(null, hist.map(function(h){ return h.correct; })) : q.correct;

  }).join('') || '<div class="footnote">全对，这一批词很稳。</div>';
  return `<div class="screen">

      <div class="doodle">${CAT}</div>

      <p class="big">${q.correct} / ${total}</p>
      <p>正确率 ${acc}% · 用时 ${fmtTime(q.seconds*1000)}</p>
      <p style="font-size:11px;color:var(--muted)">${acc >= 60 ? '及格' : '未及格'}（60% 及格线）· 限时 ${fmtTime(q.limit*1000)}</p>
      <p style="font-size:11px;color:var(--muted)">历史最佳 ${best} 题</p>
      <button class="btn-primary" data-act="quiz:again">再测一遍</button>
      <button class="ghost-btn" data-act="go:home">回到今日</button>
    </div>
    ${chipLabel('错题')}
    ${wrongHtml}
    ${hist.length ? `<div class="footnote">最近 ${Math.min(hist.length,5)} 次：${hist.slice(-5).map(function(h){ return h.d+' '+h.correct+'/'+h.total; }).join(' · ')}</div>` : ''}
  </div>`;
}

function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function makeItem(w, fresh){
  return {w:w.w, us:w.us, uk:w.uk, def:w.def, pos:w.pos, tag:w.tag, fresh:!!fresh, graded:false};
}
function buildQueue(){
  const t = todayStr();
  const due = [];
  const fresh = [];
  WORDS.forEach(function(w){
    const r = recOf(w);
    if(r && r.due <= t) due.push(w);
  });
  due.sort(function(a,b){ return recOf(a).due < recOf(b).due ? -1 : 1; });
  const lg = DB.log[t] || {};
  const needReview = Math.max(0, S.goalReview - (lg.rev || 0));
  const needNew = Math.max(0, S.goalNew - (lg.new || 0));
  const dueList = due.slice(0, needReview);
  let cursor = 0;
  while(fresh.length < needNew && cursor < WORDS.length){
    const w = WORDS[cursor];
    if(!recOf(w)) fresh.push(w);
    cursor++;
  }
  return dueList.map(function(w){ return makeItem(w, false); })
    .concat(fresh.map(function(w){ return makeItem(w, true); }));
}
function freeQueue(n){
  const len = WORDS.length;
  const start = Math.floor(Math.random() * Math.max(len - n, 1));
  return WORDS.slice(start, start + n).map(function(w){ return makeItem(w, false); });
}
function resetSessionState(){
  S.phase = 'main'; S.idx = 0; S.wrong = []; S.retry = false;
  S.answer=''; S.picked=-1; S.checked=false; S.result=false; S.flipped=false;
  S.rated = {good:0, mid:0, bad:0};
}
function startSession(){
  resetSessionState();
  S.queue = buildQueue();
  if(S.settings.shuffle) shuffleArr(S.queue);
}
function startCustom(items){
  resetSessionState();
  S.queue = items;
  if(S.settings.shuffle && items.length > 1) shuffleArr(S.queue);
}

function go(screen){
  if(screen !== 'quiz') stopClock();
  if(screen==='study'){
    const finished = S.phase==='final' ? S.idx >= Math.max(S.wrong.length,1) : S.idx >= S.queue.length;
    if(S.idx === 0 || finished) startSession();
  }
  S.screen = screen;
  if(screen!=='study') S.flipped = false;
  render();
}

/* ---------- 交互 ---------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act');

  if(act==='home:jump'){
    window.location.href = 'https://jyx010320-gif.github.io/RabbitOvOTsuki/';
    return;
  }

  if(act==='go:quiz'){
    stopClock();
    S.quiz = null;
    go('quiz');
    return;
  }

  if(act.indexOf('quiz:') === 0){
    const cmd = act.slice(5);
    if(cmd === '20' || cmd === '30' || cmd === '50'){ startQuiz(parseInt(cmd,10)); return; }
    if(cmd === 'quit'){ stopClock(); S.quiz = null; go('home'); return; }
    if(cmd === 'again'){ S.quiz = null; go('quiz'); return; }
    return;
  }

  if(act.indexOf('quizpick:') === 0){
    if(!S.quiz || S.quiz.answered) return;
    const it = S.quiz.items[S.quiz.idx];
    const i = parseInt(act.slice(9), 10);
    const right = it.opts.indexOf(it.def);
    S.quiz.picked = i;
    S.quiz.answered = true;
    S.quiz.lastOk = (i === right);
    if(S.quiz.lastOk) S.quiz.correct++;
    else S.quiz.wrongs.push(it);
    render();
    return;
  }

  if(act==='quizskip'){
    const q = S.quiz;
    if(!q || q.answered) return;
    q.picked = -1;
    q.answered = true;
    q.lastOk = false;
    q.wrongs.push(q.items[q.idx]);
    render();
    return;
  }

  if(act==='quiznext'){
    if(!S.quiz) return;
    if(S.quiz.idx + 1 >= S.quiz.items.length){ finishQuiz(); return; }
    S.quiz.idx++;
    S.quiz.picked = -1;
    S.quiz.answered = false;
    S.quiz.lastOk = false;
    render();
    return;
  }

  if(act==='quizspeak'){
    if(S.quiz && S.quiz.state==='run') speak(S.quiz.items[S.quiz.idx].w);
    return;
  }

  if(act==='free'){
    startCustom(freeQueue(20));
    S.screen = 'study';
    render();
    return;
  }

  if(act==='drill:wrong'){
    const list = wrongWords();
    if(!list.length) return;
    startCustom(list.slice(0, S.goalReview).map(function(it){ return makeItem(it.w, false); }));
    S.screen = 'study';
    render();
    return;
  }

  if(act.indexOf('letter:') === 0){
    const ch = act.slice(7);
    S.letter = (ch === '#' || ch === S.letter) ? '' : ch;
    S.listLimit = 40;
    render();
    return;
  }

  if(act.indexOf('filter:') === 0){
    S.filter = act.slice(7);
    S.listLimit = 40;
    render();
    return;
  }

  if(act==='more'){
    S.listLimit += 40;
    render();
    return;
  }

  if(act.indexOf('word:') === 0){
    const name = decodeURIComponent(act.slice(5));
    const w = WORDS.filter(function(x){ return x.w === name; })[0];
    if(w){ S.detail = w; S.screen = 'detail'; render(); }
    return;
  }

  if(act==='detail:back'){ go('library'); return; }

  if(act==='detail:study'){
    if(S.detail){
      startCustom([makeItem(S.detail, false)]);
      S.mode = 'card';
      S.screen = 'study';
      render();
    }
    return;
  }

  if(act==='detail:clear'){
    if(S.detail){
      const r = DB.words[S.book + '|' + S.detail.w.toLowerCase()];
      if(r){ r.wrong = 0; saveDB(); }
      render();
    }
    return;
  }

  if(act==='export'){ S.screen = 'backup'; render(); return; }

  if(act==='backup:download'){ exportData(); return; }

  if(act==='backup:copy'){
    const box = document.getElementById('backup-text');
    const text = box ? box.value : JSON.stringify(buildBackup(), null, 2);
    const fallback = function(){
      if(box){ box.removeAttribute('readonly'); box.focus(); box.select(); }
      alert('已选中备份内容，按 Ctrl/Cmd + C 复制，再粘到备忘录里');
    };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ alert('已复制，粘到备忘录或聊天窗口里存好'); }, fallback);
      }else fallback();
    }catch(e){ fallback(); }
    return;
  }

  if(act==='import'){ S.screen = 'restore'; render(); return; }

  if(act==='backup:pickfile'){
    const f = document.getElementById('import-file');
    if(f) f.click();
    return;
  }

  if(act==='backup:pasteapply'){
    const box = document.getElementById('restore-text');
    const text = box ? String(box.value || '').trim() : '';
    if(!text){ alert('先把备份内容粘进来'); return; }
    applyBackup(text);
    return;
  }

  if(act.startsWith('go:')){ go(act.slice(3)); return; }

  if(act.startsWith('book:')){
    const id = act.slice(5);
    if(S.book !== id){
      S.book = id;
      WORDS = activeBook().words;
      S.total = WORDS.length;
      S.letter = '';
      startSession();
      render();
    }
    return;
  }

  if(act.startsWith('mode:')){ setMode(act.slice(5)); return; }

  if(act.startsWith('accent:')){ S.settings.accent = act.slice(7); loadVoices(); savePrefs(); render(); return; }

  if(act==='check'){ checkTask(); render(); return; }

  if(act==='next'){ nextWord(); return; }

  if(act.startsWith('pick:')){
    if(S.checked) return;
    S.picked = parseInt(act.slice(5),10);
    checkTask();
    render();
    return;
  }

  if(act==='flip'){
    const card = el.classList.contains('flip-card') ? el : el.closest('.flip-card');
    S.flipped = !S.flipped;
    if(card) card.classList.toggle('flipped', S.flipped);
    const acts = document.querySelector('.actions');
    if(acts) acts.classList.toggle('locked', !S.flipped);
    if(S.flipped && S.settings.autoSpeak && S.screen==='study') speak(curWord().w);
    return;
  }

  if(act==='speak'){
    e.stopPropagation();
    speak(curWord().w);
    return;
  }

  if(act.startsWith('rate:')){
    if(!S.flipped) return;
    S.rated[act.slice(5)]++;
    gradeWord(curWord(), act.slice(5));
    nextWord();
    return;
  }

  if(act==='pick'){ return; }

  if(act.startsWith('scheme:')){
    S.scheme = act.slice(7);
    document.documentElement.dataset.scheme = S.scheme;
    document.querySelectorAll('.swatch').forEach(function(el){
      el.classList.toggle('active', el.getAttribute('data-scheme') === S.scheme);
    });
    savePrefs();
    return;
  }

  if(act.startsWith('toggle:')){
    const key = act.slice(7);
    S.settings[key] = !S.settings[key];
    savePrefs();
    render();
    return;
  }

  if(act.startsWith('goal:')){
    const [,which,dir] = act.split(':');
    if(which==='new') S.goalNew = Math.max(5, Math.min(100, S.goalNew + (dir==='+'?5:-5)));
    if(which==='rev') S.goalReview = Math.max(10, Math.min(200, S.goalReview + (dir==='+'?10:-10)));
    render();
    return;
  }
});

  }
});

    importData(el.files[0]);
    el.value = '';
  }
});

/* 键盘：空格翻面，数字评价，回车检查 */
document.addEventListener('keydown', function(e){
  if(S.screen!=='study') return;

  if(S.mode==='dictation' || S.mode==='spell'){
    if(e.key==='Enter'){
      e.preventDefault();
      if(S.checked && !S.retry) nextWord(); else { checkTask(); render(); }
    }
    return;
  }

  if(S.mode==='choice'){
    if(['1','2','3','4'].includes(e.key) && !S.checked){
      S.picked = parseInt(e.key,10)-1;
      checkTask(); render();
    }
    if(e.key==='Enter' && S.checked) nextWord();
    return;
  }

  if(e.key===' '){ e.preventDefault(); const c=document.querySelector('.flip-card'); if(c&&!S.flipped) c.click(); }
  if(['1','2','3'].includes(e.key)){
    const map = {'1':'bad','2':'mid','3':'good'};
    if(S.flipped){ S.rated[map[e.key]]++; gradeWord(curWord(), map[e.key]); nextWord(); }
  }
});

function prevWord(){
  if(S.idx <= 0) return;
  S.idx--;
  S.answer=''; S.picked=-1; S.checked=false; S.result=false; S.flipped=false; S.retry=false;
  render();
}

/* 手势：左滑翻面或下一个，右滑回上一个 */
let touchX = 0, touchY = 0, touching = false;
document.addEventListener('touchstart', function(e){
  if(S.screen !== 'study') return;
  const t = e.touches[0];
  touchX = t.clientX; touchY = t.clientY; touching = true;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(!touching || S.screen !== 'study') return;
  touching = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchX;
  const dy = t.clientY - touchY;
  if(Math.abs(dx) < 55 || Math.abs(dy) > 50) return;
  if(dx < 0){
    if(S.mode === 'card' && !S.flipped){ S.flipped = true; render(); return; }
    nextWord();
  }else{
    prevWord();
  }
}, {passive:true});

render();
</script>
